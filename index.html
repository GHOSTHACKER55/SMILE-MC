<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMILE MC | PREMIUM STORE 👑</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800;900&display=swap');

body{
    font-family:'Plus Jakarta Sans',sans-serif;
    background:#ffffff;
    color:#000;
    margin:0;
    padding-bottom:100px
}

/* ORIGINAL STYLES KEPT */
.brand-logo{
    font-size:1.6rem;
    font-weight:900;
    text-transform:uppercase;
    letter-spacing:-1.5px;
    display:flex;
    align-items:center;
    gap:8px
}
.modal{
    display:none;
    position:fixed;
    inset:0;
    z-index:1000;
    background:rgba(0,0,0,.9);
    backdrop-filter:blur(10px)
}
.active-modal{
    display:flex;
    align-items:center;
    justify-content:center
}
.portal-card{
    background:white;
    border-radius:40px;
    padding:30px;
    width:95%;
    max-width:400px;
    max-height:90vh;
    overflow-y:auto
}
.step-hidden{display:none}

input{
    border:2px solid #f0f0f0;
    outline:none;
    transition:.2s;
    border-radius:18px;
    font-weight:600
}
input:focus{
    border-color:#000;
    background:#fff
}

/* BEAUTIFUL PLACEHOLDER (ADDED ONLY) */
input::placeholder{
    letter-spacing:1.4px;
    font-weight:900;
    opacity:.35;
    transition:.3s
}
input:focus::placeholder{
    opacity:.15;
    transform:translateX(6px)
}

/* TOAST POPUPS */
#toast-container{
    position:fixed;
    top:24px;
    right:24px;
    z-index:9999;
    display:flex;
    flex-direction:column;
    gap:12px
}
.toast{
    min-width:260px;
    padding:16px 20px;
    border-radius:18px;
    font-weight:900;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1px;
    animation:toastIn .4s ease,toastOut .4s ease 3.6s forwards;
    box-shadow:0 20px 40px rgba(0,0,0,.2)
}
.toast-success{background:#000;color:#fff}
.toast-error{background:#fee2e2;color:#991b1b}
.toast-info{background:#f3f4f6;color:#000}

@keyframes toastIn{
    from{transform:translateX(120%);opacity:0}
    to{transform:translateX(0);opacity:1}
}
@keyframes toastOut{
    to{opacity:0;transform:translateX(120%)}
}
</style>
</head>

<body>

<!-- TOAST -->
<div id="toast-container"></div>

<header class="p-6 flex items-center justify-between sticky top-0 bg-white z-50">
    <h1 class="brand-logo">SMILE MC 👑</h1>
    <div id="user-display" class="text-[10px] font-black uppercase tracking-widest opacity-30">Guest</div>
</header>

<main class="p-6 md:px-12 max-w-7xl mx-auto">

<!-- 🔍 BEAUTIFUL SEARCH RANK (ADDED – NO UI CHANGE) -->
<div class="mb-8">
    <input id="searchInput"
           oninput="searchProducts()"
           placeholder="SEARCH RANK"
           class="w-full p-5 bg-gray-50 text-[11px] uppercase font-black tracking-[3px] rounded-[28px]">
</div>

<section id="page-home">
    <div id="product-grid" class="grid grid-cols-2 md:grid-cols-4 gap-6"></div>
</section>

</main>

<nav class="fixed bottom-8 left-1/2 -translate-x-1/2 w-[90%] max-w-md bg-black text-white rounded-[35px] p-6 flex justify-around z-50">
    <div class="text-center cursor-pointer">
        <span class="text-xl">🏠</span>
        <p class="text-[8px] font-black uppercase mt-1 opacity-50">Store</p>
    </div>
    <div onclick="openModal('authModal')" class="text-center cursor-pointer">
        <span class="text-xl">👤</span>
        <p class="text-[8px] font-black uppercase mt-1 opacity-50">Account</p>
    </div>
    <div onclick="promptAdmin()" class="text-center cursor-pointer">
        <span class="text-xl">🛡️</span>
        <p class="text-[8px] font-black uppercase mt-1 opacity-50">Staff</p>
    </div>
</nav>

<!-- AUTH MODAL (UNCHANGED) -->
<div id="authModal" class="modal">
<div class="portal-card">
    <h2 class="text-2xl font-black uppercase mb-6">Sign In</h2>
    <input id="auth-email" placeholder="EMAIL ADDRESS" class="w-full p-4 bg-gray-50 text-[11px] mb-3">
    <input id="auth-pass" placeholder="PASSWORD" type="password" class="w-full p-4 bg-gray-50 text-[11px]">
    <button onclick="handleAuth()" class="w-full bg-black text-white py-5 rounded-2xl font-black text-[11px] uppercase mt-5">
        Continue
    </button>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig={
 apiKey:"AIzaSyC41Y6mNNBFvjNeHdOOWGsjczMjyaqoqjU",
 authDomain:"fajar-collection-8aba3.firebaseapp.com",
 projectId:"fajar-collection-8aba3"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const auth=getAuth(app);

let allProducts=[];

/* TOAST */
window.showToast=(msg,type="success")=>{
 const t=document.createElement("div");
 t.className=`toast toast-${type}`;
 t.innerText=msg;
 document.getElementById("toast-container").appendChild(t);
 setTimeout(()=>t.remove(),4200);
};

/* AUTH */
window.handleAuth=async()=>{
 try{
  await signInWithEmailAndPassword(auth,
    document.getElementById("auth-email").value,
    document.getElementById("auth-pass").value
  );
  closeModal('authModal');
  showToast("Logged In Successfully 👑");
 }catch{
  await createUserWithEmailAndPassword(auth,
    document.getElementById("auth-email").value,
    document.getElementById("auth-pass").value
  );
  closeModal('authModal');
  showToast("Account Created 🚀");
 }
};

onAuthStateChanged(auth,u=>{
 document.getElementById("user-display").innerText=u?"Connected":"Guest";
});

/* PRODUCTS */
onSnapshot(query(collection(db,"products"),orderBy("createdAt","desc")),snap=>{
 allProducts=snap.docs.map(d=>d.data());
 renderProducts(allProducts);
});

function renderProducts(list){
 document.getElementById("product-grid").innerHTML=list.map(p=>`
 <div class="bg-white rounded-[35px] border border-gray-100 overflow-hidden shadow-sm">
   <img src="${p.image}" class="w-full aspect-square object-cover">
   <div class="p-5">
     <p class="text-[10px] font-black uppercase opacity-20">${p.name}</p>
     <p class="text-xl font-black mb-4">Rs.${p.price}</p>
     <button class="w-full py-4 bg-black text-white rounded-2xl text-[9px] font-black uppercase tracking-widest">
       Buy Now
     </button>
   </div>
 </div>`).join("");
}

/* SEARCH RANK LOGIC */
window.searchProducts=()=>{
 const q=document.getElementById("searchInput").value.toLowerCase();
 renderProducts(allProducts.filter(p=>p.name.toLowerCase().includes(q)));
};

/* UI */
window.openModal=id=>document.getElementById(id).classList.add("active-modal");
window.closeModal=id=>document.getElementById(id).classList.remove("active-modal");
window.promptAdmin=()=>showToast("Admin Access Locked 🔐","error");
</script>

</body>
</html>
