<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMILE MC | Premium 💫</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fcfcfc; color: #1a1a1a; margin: 0; padding-bottom: 100px; }
        
        .brand-logo {
            font-size: clamp(1.5rem, 5vw, 2rem); font-weight: 900; font-style: italic;
            background: linear-gradient(45deg, #00c6ff, #0072ff, #00ffaa);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        /* Portal Styling (The "Ghosty" Look) */
        .modal { display: none; position: fixed; z-index: 1000; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(15px); }
        .active-modal { display: flex; align-items: center; justify-content: center; }
        
        .portal-card {
            background: white; border-radius: 40px; padding: 40px; 
            width: 90%; max-width: 380px; text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .glass-nav { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-top: 1px solid rgba(0,0,0,0.05); }
        
        /* Buy Now Button Style */
        .buy-now-btn {
            background: #ffffff;
            color: #000000;
            border: 1.5px solid #000000;
            transition: all 0.3s ease;
            font-weight: 800;
        }
        .buy-now-btn:hover { background: #000000; color: #ffffff; transform: scale(1.02); }

        /* Card Text Centering */
        .product-title {
            font-weight: 800;
            text-align: center;
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: -0.02em;
        }
        .product-price {
            font-weight: 600;
            text-align: center;
            color: #1a1a1a;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div id="deleteConfirmModal" class="modal">
        <div class="portal-card">
            <div class="w-16 h-16 bg-red-50 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">⚠️</div>
            <h2 class="text-xl font-black italic uppercase mb-2">Delete Product?</h2>
            <p class="text-[10px] font-bold opacity-40 uppercase mb-8 leading-relaxed">Ghosty Security: This action is permanent.<br>The item will be removed from inventory.</p>
            <input type="hidden" id="delete-target-id">
            <button onclick="executeDelete()" class="w-full bg-red-500 text-white py-5 rounded-2xl font-black text-[11px] uppercase tracking-[0.2em] mb-3">Delete Forever</button>
            <button onclick="closeModal('deleteConfirmModal')" class="w-full bg-gray-100 text-black py-4 rounded-2xl font-black text-[10px] uppercase">Cancel</button>
        </div>
    </div>

    <div id="adminAuthModal" class="modal">
        <div class="portal-card">
            <h2 class="text-xl font-black italic uppercase mb-2">Staff Access</h2>
            <p class="text-[9px] font-bold opacity-40 uppercase mb-8 tracking-widest">GHOSTY DEVELOPER SECURE PORTAL</p>
            <input type="password" id="admin-pass-input" placeholder="ENTER PASSWORD" class="w-full p-5 rounded-2xl mb-6 text-center text-sm font-black bg-gray-50 border-2 border-transparent focus:border-blue-500 outline-none">
            <button onclick="verifyAdmin()" class="w-full bg-blue-600 text-white py-5 rounded-2xl font-black text-[11px] uppercase tracking-[0.2em]">Unlock</button>
            <button onclick="closeModal('adminAuthModal')" class="mt-6 text-[9px] font-black uppercase opacity-30 cursor-pointer">Close</button>
        </div>
    </div>

    <header class="p-6 md:px-12 flex justify-between items-center sticky top-0 bg-[#fcfcfc]/80 backdrop-blur-md z-50">
        <h1 class="brand-logo">SMILE MC 💫</h1>
    </header>

    <main class="px-6 md:px-12 max-w-7xl mx-auto">
        <section id="page-home">
            <div id="product-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 mt-4"></div>
        </section>

        <section id="page-admin" class="hidden">
            <div class="grid lg:grid-cols-3 gap-8 items-start">
                <div class="bg-white p-8 rounded-[40px] border shadow-sm">
                    <h3 id="form-header" class="font-black text-[10px] uppercase mb-6 italic text-blue-600">Product Manager 🛠️</h3>
                    <div class="space-y-4">
                        <input type="hidden" id="edit-product-id">
                        <input type="text" id="p-name" placeholder="PRODUCT NAME" class="w-full p-4 bg-gray-50 rounded-xl text-[10px] font-bold outline-none border focus:border-blue-400">
                        <input type="number" id="p-price" placeholder="PRICE (RS)" class="w-full p-4 bg-gray-50 rounded-xl text-[10px] font-bold outline-none border focus:border-blue-400">
                        <textarea id="p-desc" placeholder="DESCRIPTION" class="w-full p-4 bg-gray-50 rounded-xl text-[10px] font-bold h-24 outline-none border focus:border-blue-400"></textarea>
                        <input type="file" id="p-file" class="text-[10px] w-full font-bold">
                        <div class="flex gap-2 pt-2">
                            <button onclick="handlePublish()" id="publish-btn" class="flex-1 bg-black text-white py-4 rounded-xl font-black text-[10px] uppercase">Post Product</button>
                            <button onclick="cancelEdit()" id="cancel-edit-btn" class="hidden bg-gray-200 text-black px-4 rounded-xl font-black text-[9px] uppercase">Cancel</button>
                        </div>
                    </div>
                </div>
                <div class="lg:col-span-2 space-y-4">
                    <h3 class="font-black text-[10px] uppercase italic text-gray-400">Inventory</h3>
                    <div id="admin-inventory-list" class="grid grid-cols-1 gap-3"></div>
                </div>
            </div>
        </section>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 glass-nav p-5 flex justify-around items-center z-50">
        <div id="nav-home" onclick="showPage('home')" class="nav-btn nav-active"><span class="text-xl">🏠</span><span class="text-[8px] font-bold uppercase">Home</span></div>
        <div id="nav-staff" onclick="openModal('adminAuthModal')" class="nav-btn"><span class="text-xl">🛠️</span><span class="text-[8px] font-bold uppercase">Staff</span></div>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, updateDoc, serverTimestamp, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC41Y6mNNBFvjNeHdOOWGsjczMjyaqoqjU",
            authDomain: "fajar-collection-8aba3.firebaseapp.com",
            projectId: "fajar-collection-8aba3",
            storageBucket: "fajar-collection-8aba3.firebasestorage.app",
            messagingSenderId: "620336064195",
            appId: "1:620336064195:web:4608ae5f133de8fa17a476"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const DISCORD_LINK = "https://discord.gg/r6t7JjAwTA";
        let allProducts = [];

        window.verifyAdmin = () => {
            if (document.getElementById('admin-pass-input').value === "GHOSTYDEVELOPER") {
                closeModal('adminAuthModal');
                showPage('admin');
            } else alert("WRONG PASSWORD");
        };

        // CUSTOM DELETE LOGIC
        window.askDelete = (id) => {
            document.getElementById('delete-target-id').value = id;
            openModal('deleteConfirmModal');
        };

        window.executeDelete = async () => {
            const id = document.getElementById('delete-target-id').value;
            if(id) {
                await deleteDoc(doc(db, 'products', id));
                closeModal('deleteConfirmModal');
            }
        };

        onSnapshot(query(collection(db, "products"), orderBy("createdAt", "desc")), snap => {
            allProducts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            renderStore();
            renderInventoryList();
        });

        function renderStore() {
            document.getElementById('product-grid').innerHTML = allProducts.map(p => `
                <div class="bg-white rounded-3xl overflow-hidden flex flex-col h-full border border-gray-50">
                    <img src="${p.image}" class="aspect-square object-cover w-full">
                    <div class="p-4 flex flex-col flex-1">
                        <h4 class="product-title">${p.name}</h4>
                        <p class="product-price text-sm">Rs.${p.price} PKR</p>
                        <a href="${DISCORD_LINK}" target="_blank" class="buy-now-btn w-full mt-4 py-3 rounded-xl text-[10px] uppercase text-center">Buy Now !</a>
                    </div>
                </div>
            `).join('');
        }

        window.handlePublish = async () => {
            const name = document.getElementById('p-name').value, price = document.getElementById('p-price').value, 
                  desc = document.getElementById('p-desc').value, file = document.getElementById('p-file').files[0],
                  editId = document.getElementById('edit-product-id').value;

            if(!name || !price) return alert("Fill Name/Price");
            let imgUrl = editId ? allProducts.find(x => x.id === editId).image : "";

            if(file) {
                const fd = new FormData(); fd.append("image", file);
                const r = await fetch("https://api.imgbb.com/1/upload?key=a107d2f7b3059bbb23a1b6e9f61153c7", { method: "POST", body: fd });
                const d = await r.json(); imgUrl = d.data.url;
            }

            const payload = { name, price, description: desc, image: imgUrl, updatedAt: serverTimestamp() };
            if(editId) { await updateDoc(doc(db, "products", editId), payload); cancelEdit(); }
            else { payload.createdAt = serverTimestamp(); await addDoc(collection(db, "products"), payload); }
            
            document.getElementById('p-name').value = ''; document.getElementById('p-price').value = ''; document.getElementById('p-file').value = '';
        };

        function renderInventoryList() {
            document.getElementById('admin-inventory-list').innerHTML = allProducts.map(p => `
                <div class="flex items-center gap-3 bg-white p-3 rounded-2xl border">
                    <img src="${p.image}" class="w-12 h-12 rounded-xl object-cover">
                    <div class="flex-1 text-[10px] font-black truncate uppercase">${p.name}</div>
                    <div class="flex gap-4 px-2">
                        <button onclick="editProduct('${p.id}')" class="text-blue-500 font-bold text-[10px]">EDIT</button>
                        <button onclick="askDelete('${p.id}')" class="text-red-500 font-bold text-[10px]">DEL</button>
                    </div>
                </div>
            `).join('');
        }

        window.showPage = id => {
            document.querySelectorAll('main > section').forEach(s => s.classList.add('hidden'));
            document.getElementById(`page-${id}`).classList.remove('hidden');
        };

        window.openModal = (id) => document.getElementById(id).classList.add('active-modal');
        window.closeModal = (id) => document.getElementById(id).classList.remove('active-modal');

        showPage('home');
    </script>
</body>
</html>
