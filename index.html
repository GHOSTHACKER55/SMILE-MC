<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMILE MC | Dark Store</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
body{
 background:#0b0b0f;
 color:#fff;
 font-family:Inter,sans-serif;
 padding-bottom:120px
}
input{
 background:#14141b;
 border:1px solid #222;
 border-radius:14px;
 padding:14px;
 font-size:12px;
 width:100%;
 color:#fff
}
.modal{
 display:none;
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.9);
 z-index:999;
 align-items:center;
 justify-content:center
}
.modal.active{display:flex}
.card{
 background:#14141b;
 padding:24px;
 border-radius:24px;
 width:95%;
 max-width:420px
}
.step{display:none}
.step.active{display:block}
</style>
</head>

<body>

<header class="p-5 flex justify-between sticky top-0 bg-[#0b0b0f] z-50">
 <h1 class="font-black text-xl">SMILE MC</h1>
 <span class="text-xs opacity-40">Store</span>
</header>

<div class="p-5 max-w-6xl mx-auto">
 <input id="search" placeholder="SEARCH RANK" oninput="filterProducts()"
  class="mb-8 uppercase tracking-[3px] text-xs font-black">
</div>

<main id="products" class="px-5 max-w-6xl mx-auto grid grid-cols-2 md:grid-cols-4 gap-5"></main>

<!-- NAV -->
<nav class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-md bg-[#14141b] rounded-full p-5 flex justify-around text-lg">
 <span onclick="toast('Home')">🏠</span>
 <span onclick="toast('Cart Empty')">🛒</span>
 <span onclick="openModal('adminLogin')">🛡️</span>
</nav>

<!-- CHECKOUT -->
<div id="checkout" class="modal">
 <div class="card">
  <div class="step active" id="s1">
   <h2 class="font-black mb-4">Order Details</h2>
   <input id="n" placeholder="FULL NAME" class="mb-3">
   <input id="w" placeholder="WHATSAPP NUMBER" class="mb-3">
   <input id="e" placeholder="GMAIL" class="mb-3">
   <input id="d" placeholder="DISCORD ID" class="mb-3">
   <input id="i" placeholder="MINECRAFT IGN" class="mb-5">
   <button onclick="goStep(2)" class="w-full bg-indigo-500 py-4 rounded-xl font-black">NEXT</button>
  </div>

  <div class="step" id="s2">
   <h2 class="font-black mb-4">Payment</h2>
   <div class="bg-black p-4 rounded-xl text-center mb-5">
    <p class="opacity-60 text-xs">My Account</p>
    <p class="text-xl font-black">03106723295</p>
    <p>Easypaisa</p>
    <p class="font-bold">Tehmina Ahtisham</p>
   </div>
   <button onclick="goStep(3)" class="w-full bg-indigo-500 py-4 rounded-xl font-black">I HAVE PAID</button>
  </div>

  <div class="step text-center" id="s3">
   <div class="text-4xl mb-3">✅</div>
   <p class="opacity-60 mb-4">If you have paid contact admin</p>
   <a href="https://wa.me/923706116030" target="_blank"
    class="block bg-green-600 py-4 rounded-xl font-black mb-3">
    WhatsApp Admin
   </a>
   <div class="bg-black py-3 rounded-xl text-xs font-bold">
    Discord: frostdragon._.
   </div>
  </div>
 </div>
</div>

<!-- ADMIN LOGIN -->
<div id="adminLogin" class="modal">
 <div class="card">
  <h2 class="font-black mb-4">Admin Login</h2>
  <input id="adminPass" placeholder="ADMIN PASSWORD" type="password" class="mb-4">
  <button onclick="adminLogin()" class="w-full bg-red-600 py-4 rounded-xl font-black">
   LOGIN
  </button>
 </div>
</div>

<!-- ADMIN PANEL -->
<div id="adminPanel" class="modal">
 <div class="card">
  <h2 class="font-black mb-4">Admin Panel</h2>
  <div id="orders" class="text-xs opacity-70 mb-4">No orders yet</div>
  <button onclick="closeModal('adminPanel')" class="w-full bg-gray-700 py-3 rounded-xl font-black">
   CLOSE
  </button>
 </div>
</div>

<script>
const ADMIN_PASSWORD="admin123";

const productsData=[
 {name:"VIP Rank",price:500,image:"https://via.placeholder.com/400x400?text=VIP"},
 {name:"MVP Rank",price:1000,image:"https://via.placeholder.com/400x400?text=MVP"},
 {name:"Legend Rank",price:2000,image:"https://via.placeholder.com/400x400?text=Legend"},
 {name:"Ultra Rank",price:3000,image:"https://via.placeholder.com/400x400?text=Ultra"}
];

let selectedProduct="";

function render(list){
 products.innerHTML=list.map(p=>`
 <div class="bg-[#14141b] rounded-2xl overflow-hidden">
  <img src="${p.image}" class="w-full aspect-square object-cover">
  <div class="p-4">
   <p class="text-xs opacity-40 font-black uppercase">${p.name}</p>
   <p class="text-xl font-black mb-4">Rs. ${p.price}</p>
   <button onclick="buy('${p.name}')"
    class="w-full bg-indigo-500 py-3 rounded-xl font-black text-xs uppercase">
    Buy Now
   </button>
  </div>
 </div>`).join("");
}
render(productsData);

function filterProducts(){
 const q=search.value.toLowerCase();
 render(productsData.filter(p=>p.name.toLowerCase().includes(q)));
}

function buy(n){
 selectedProduct=n;
 openModal('checkout');
 goStep(1);
}

function goStep(s){
 document.querySelectorAll(".step").forEach(x=>x.classList.remove("active"));
 document.getElementById("s"+s).classList.add("active");
 if(s===3){
  orders.innerHTML+=`<div>Order: ${selectedProduct}</div>`;
 }
}

function openModal(id){document.getElementById(id).classList.add("active")}
function closeModal(id){document.getElementById(id).classList.remove("active")}

window.onclick=e=>{
 if(e.target.classList.contains("modal")) e.target.classList.remove("active");
}

function adminLogin(){
 if(adminPass.value===ADMIN_PASSWORD){
  closeModal('adminLogin');
  openModal('adminPanel');
 }else{
  alert("Wrong password");
 }
}

function toast(msg){console.log(msg)}
</script>

</body>
</html>
