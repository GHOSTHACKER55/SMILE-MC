<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMILE MC | PREMIUM STORE 👑</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fafafa; color: #000000; margin: 0; padding-bottom: 100px; }
        
        .brand-logo { font-size: 1.6rem; font-weight: 900; text-transform: uppercase; letter-spacing: -1.5px; }
        
        /* MODERN MODALS */
        .modal { display: none; position: fixed; z-index: 1000; inset: 0; background: rgba(255,255,255,0.8); backdrop-filter: blur(20px); transition: all 0.3s ease; }
        .active-modal { display: flex; align-items: center; justify-content: center; }
        .portal-card { background: white; border-radius: 40px; padding: 40px; width: 95%; max-width: 420px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.1); border: 1px solid #eee; }
        
        /* BEAUTIFUL NOTIFICATIONS */
        #toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; width: 90%; max-width: 400px; }
        .toast { background: #000; color: #fff; padding: 16px 24px; border-radius: 20px; font-weight: 700; font-size: 12px; text-transform: uppercase; margin-bottom: 10px; box-shadow: 0 10px 20px rgba(0,0,0,0.2); display: flex; align-items: center; gap: 10px; animation: slideUp 0.4s ease; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        input { border: 2px solid #f5f5f5; outline: none; transition: all 0.2s; border-radius: 20px; font-weight: 600; background: #f9f9f9; }
        input:focus { border-color: #000; background: #fff; transform: translateY(-2px); }

        .profile-img-preview { width: 100px; height: 100px; border-radius: 35px; object-fit: cover; border: 4px solid #fff; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .nav-card { box-shadow: 0 -10px 40px rgba(0,0,0,0.05); border-top: 1px solid #eee; }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <div id="staffModal" class="modal">
        <div class="portal-card text-center">
            <div class="mb-6">
                <span class="text-4xl">🔐</span>
                <h2 class="text-2xl font-black uppercase mt-4 tracking-tighter">Staff Access</h2>
                <p class="text-[10px] font-bold opacity-40">SECURE ADMIN PORTAL</p>
            </div>
            <input type="password" id="staff-key-input" placeholder="ENTER ACCESS KEY" class="w-full p-5 text-center text-lg mb-4 tracking-[10px]">
            <button onclick="verifyStaff()" class="w-full bg-black text-white py-5 rounded-2xl font-black text-[12px] uppercase tracking-widest hover:scale-[1.02] active:scale-[0.98] transition-all">Unlock Dashboard</button>
            <button onclick="closeModal('staffModal')" class="mt-6 text-[10px] font-bold opacity-30 uppercase">Cancel</button>
        </div>
    </div>

    <div id="profileModal" class="modal">
        <div class="portal-card">
            <h2 class="text-2xl font-black uppercase mb-6 tracking-tighter">My Profile</h2>
            <div class="flex flex-col items-center mb-6">
                <img id="profile-preview" src="https://ui-avatars.com/api/?name=User&background=000&color=fff" class="profile-img-preview mb-4">
                <label class="cursor-pointer bg-gray-100 px-4 py-2 rounded-full text-[10px] font-black uppercase">
                    Change Photo
                    <input type="file" id="profile-upload" class="hidden" onchange="previewImage(this)">
                </label>
            </div>
            <div class="space-y-3">
                <input type="text" id="prof-name" placeholder="FULL NAME" class="w-full p-4 text-[11px]">
                <input type="password" id="prof-pass" placeholder="NEW PASSWORD" class="w-full p-4 text-[11px]">
                <button onclick="updateProfile()" class="w-full bg-black text-white py-5 rounded-2xl font-black text-[11px] uppercase tracking-widest mt-4">Save Changes</button>
                <button onclick="auth.signOut(); closeModal('profileModal')" class="w-full text-red-500 font-black text-[10px] uppercase mt-4">Sign Out</button>
            </div>
            <button onclick="closeModal('profileModal')" class="w-full text-[9px] font-black opacity-20 uppercase mt-4">Close</button>
        </div>
    </div>

    <header class="p-8 md:px-12 flex items-center justify-between sticky top-0 bg-white/80 backdrop-blur-md z-50">
        <div class="flex items-center">
            <div id="global-back-btn" onclick="showPage('home')" class="mr-4 text-2xl font-black cursor-pointer hidden">←</div>
            <h1 class="brand-logo">SMILE MC 👑</h1>
        </div>
        <div id="user-display" class="bg-black text-white px-4 py-2 rounded-full text-[10px] font-black uppercase">Guest</div>
    </header>

    <main class="p-6 max-w-7xl mx-auto">
        <section id="page-home">
            <div id="product-grid" class="grid grid-cols-2 md:grid-cols-4 gap-6"></div>
        </section>

        <section id="page-admin" class="hidden">
            <div class="flex gap-4 mb-10">
                <h2 class="text-2xl font-black uppercase">Staff Panel</h2>
            </div>
            <div id="tab-users" class="space-y-3"></div>
        </section>
    </main>

    <nav class="fixed bottom-8 left-1/2 -translate-x-1/2 w-[92%] max-w-md bg-white rounded-[40px] p-5 flex justify-around items-center z-50 nav-card">
        <div onclick="showPage('home')" class="cursor-pointer text-center group">
            <span class="block text-2xl group-hover:scale-110 transition-transform">🏠</span>
            <p class="text-[8px] font-black uppercase mt-1 opacity-40">Store</p>
        </div>
        <div onclick="openAccount()" class="cursor-pointer text-center group">
            <span class="block text-2xl group-hover:scale-110 transition-transform">👤</span>
            <p class="text-[8px] font-black uppercase mt-1 opacity-40">Profile</p>
        </div>
        <div onclick="openModal('staffModal')" class="cursor-pointer text-center group">
            <span class="block text-2xl group-hover:scale-110 transition-transform">🛡️</span>
            <p class="text-[8px] font-black uppercase mt-1 opacity-40">Staff</p>
        </div>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, setDoc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, updatePassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC41Y6mNNBFvjNeHdOOWGsjczMjyaqoqjU",
            authDomain: "fajar-collection-8aba3.firebaseapp.com",
            projectId: "fajar-collection-8aba3",
            storageBucket: "fajar-collection-8aba3.firebasestorage.app",
            messagingSenderId: "620336064195",
            appId: "1:620336064195:web:4608ae5f133de8fa17a476"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // --- BEAUTIFUL ALERTS ---
        window.notify = (msg, type = 'success') => {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast`;
            toast.innerHTML = `<span>${type === 'success' ? '✅' : '❌'}</span> ${msg}`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        };

        // --- STAFF SYSTEM ---
        window.verifyStaff = () => {
            const key = document.getElementById('staff-key-input').value;
            if(key === "GHOSTYDEVELOPER") {
                notify("Access Granted, Welcome Staff");
                closeModal('staffModal');
                showPage('admin');
                loadAdminData();
            } else {
                notify("Invalid Access Key", "error");
            }
        };

        // --- PROFILE SYSTEM ---
        window.openAccount = () => {
            if(!auth.currentUser) return openModal('authModal');
            loadProfileData();
            openModal('profileModal');
        };

        async function loadProfileData() {
            const userDoc = await getDoc(doc(db, "users", auth.currentUser.uid));
            if(userDoc.exists()) {
                const data = userDoc.data();
                document.getElementById('prof-name').value = data.name;
                if(data.profilePic) document.getElementById('profile-preview').src = data.profilePic;
            }
        }

        window.updateProfile = async () => {
            const newName = document.getElementById('prof-name').value;
            const newPass = document.getElementById('prof-pass').value;
            const user = auth.currentUser;

            try {
                await updateDoc(doc(db, "users", user.uid), { name: newName });
                if(newPass) await updatePassword(user, newPass);
                notify("Profile Updated Successfully");
                closeModal('profileModal');
            } catch (e) {
                notify(e.message, "error");
            }
        };

        // --- PHOTO UPLOAD ---
        window.previewImage = async (input) => {
            const file = input.files[0];
            if(!file) return;

            // Upload to ImgBB
            const fd = new FormData(); fd.append("image", file);
            try {
                notify("Uploading Photo...");
                const r = await fetch("https://api.imgbb.com/1/upload?key=a107d2f7b3059bbb23a1b6e9f61153c7", { method: "POST", body: fd });
                const d = await r.json();
                const url = d.data.url;
                document.getElementById('profile-preview').src = url;
                await updateDoc(doc(db, "users", auth.currentUser.uid), { profilePic: url });
                notify("Photo Updated!");
            } catch (e) { notify("Upload Failed", "error"); }
        };

        // Overriding the default handleAuth to use custom notify
        window.handleAuth = async () => {
            const email = document.getElementById('auth-email').value;
            const pass = document.getElementById('auth-pass').value;
            try {
                if (isSignUp) {
                    const res = await createUserWithEmailAndPassword(auth, email, pass);
                    await setDoc(doc(db, "users", res.user.uid), { 
                        name: document.getElementById('reg-name').value, 
                        email, 
                        profilePic: "" 
                    });
                    notify("Account Created!");
                } else { 
                    await signInWithEmailAndPassword(auth, email, pass); 
                    notify("Welcome Back!");
                }
                closeModal('authModal');
            } catch (e) { 
                if(e.code === 'auth/email-already-in-use') notify("This email is already registered", "error");
                else notify(e.message, "error");
            }
        };

        // Standard helpers
        window.openModal = id => document.getElementById(id).classList.add('active-modal');
        window.closeModal = id => document.getElementById(id).classList.remove('active-modal');
        window.showPage = id => {
            document.querySelectorAll('main > section').forEach(s => s.classList.add('hidden'));
            document.getElementById(`page-${id}`).classList.remove('hidden');
        };

        onAuthStateChanged(auth, user => {
            document.getElementById('user-display').innerText = user ? "Connected" : "Guest";
        });
    </script>
</body>
</html>
