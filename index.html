<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMILE MC | PREMIUM STORE 👑</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fafafa; color: #000000; margin: 0; padding-bottom: 120px; }
        .brand-logo { font-size: 1.6rem; font-weight: 900; text-transform: uppercase; letter-spacing: -1.5px; }
        .modal { display: none; position: fixed; z-index: 1000; inset: 0; background: rgba(255,255,255,0.8); backdrop-filter: blur(15px); }
        .active-modal { display: flex; align-items: center; justify-content: center; animation: fadeIn 0.3s ease; }
        .portal-card { background: white; border-radius: 40px; padding: 40px; width: 95%; max-width: 420px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.1); border: 1px solid #eee; position: relative; max-height: 85vh; overflow-y: auto; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        #toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; width: 90%; max-width: 450px; }
        .toast { background: #000; color: #fff; padding: 20px; border-radius: 28px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); display: flex; align-items: center; gap: 15px; animation: slideDown 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-40px); } to { opacity: 1; transform: translateY(0); } }
        input { border: 2px solid #f5f5f5; outline: none; border-radius: 20px; font-weight: 600; background: #f9f9f9; width: 100%; padding: 16px; font-size: 12px; margin-bottom: 10px; }
        input:focus { border-color: #000; background: #fff; }
        .step-hidden { display: none; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <div id="checkoutModal" class="modal">
        <div class="portal-card">
            <div id="check-step-1">
                <h2 class="text-xl font-black uppercase mb-6">🟢 Step 1: Details</h2>
                <input type="text" id="ord-name" placeholder="FULL NAME">
                <input type="text" id="ord-wa" placeholder="WHATSAPP NUMBER">
                <input type="email" id="ord-mail" placeholder="GMAIL ADDRESS">
                <input type="text" id="ord-discord" placeholder="DISCORD ID (e.g. user#0000)">
                <input type="text" id="ord-ign" placeholder="MINECRAFT IGN">
                <button onclick="nextStep(2)" class="w-full bg-black text-white py-5 rounded-2xl font-black text-[11px] uppercase mt-4">Next: Payment</button>
            </div>

            <div id="check-step-2" class="step-hidden text-center">
                <h2 class="text-xl font-black uppercase mb-6">🟢 Step 2: Payment</h2>
                <div class="bg-gray-50 p-6 rounded-[30px] border-2 border-dashed border-gray-200 mb-6 text-left">
                    <p class="text-[9px] font-black opacity-40 uppercase">Easypaisa Account</p>
                    <p class="text-lg font-black mt-1">Tehmina Ahtisham</p>
                    <p class="text-2xl font-black tracking-tighter text-blue-600">03106723295</p>
                </div>
                <button onclick="submitOrder()" class="w-full bg-black text-white py-5 rounded-2xl font-black text-[11px] uppercase">✅ I Have Paid</button>
                <button onclick="nextStep(1)" class="mt-4 text-[9px] font-black opacity-30 uppercase">Go Back</button>
            </div>

            <div id="check-step-3" class="step-hidden text-center">
                <div class="text-5xl mb-4">🚀</div>
                <h2 class="text-xl font-black uppercase mb-2">Order Submitted!</h2>
                <p class="text-[11px] font-medium opacity-60 mb-8 px-4">If you have paid, please contact the admin now to confirm your order.</p>
                
                <div class="space-y-3">
                    <a href="https://wa.me/923706116030" target="_blank" class="block w-full bg-[#25D366] text-white py-4 rounded-2xl font-black text-[11px] uppercase">WhatsApp Admin</a>
                    <div class="bg-indigo-600 text-white py-4 rounded-2xl font-black text-[11px] uppercase">Discord: frostdragon._.</div>
                </div>
                <button onclick="closeModal('checkoutModal')" class="mt-6 text-[10px] font-black opacity-30 uppercase">Close Window</button>
            </div>
        </div>
    </div>

    <header class="p-8 md:px-12 flex items-center justify-between sticky top-0 bg-white/80 backdrop-blur-md z-50 border-b border-gray-100">
        <h1 class="brand-logo">SMILE MC 👑</h1>
        <div id="user-display" class="bg-black text-white px-4 py-2 rounded-full text-[10px] font-black uppercase">Guest</div>
    </header>

    <main class="p-6 max-w-7xl mx-auto">
        <section id="page-home">
            <div id="product-grid" class="grid grid-cols-2 md:grid-cols-4 gap-6"></div>
        </section>

        <section id="page-admin" class="hidden">
            <div class="grid grid-cols-2 gap-4 mb-8">
                <div class="bg-white p-6 rounded-[30px] border">
                    <p class="text-[9px] font-black opacity-40 uppercase">Total Visitors</p>
                    <h3 id="stat-visitors" class="text-3xl font-black tracking-tighter">0</h3>
                </div>
                <div class="bg-white p-6 rounded-[30px] border">
                    <p class="text-[9px] font-black opacity-40 uppercase">Status</p>
                    <h3 class="text-xl font-black tracking-tighter text-green-500">Live 🟢</h3>
                </div>
            </div>

            <div class="flex gap-2 mb-8 overflow-x-auto no-scrollbar">
                <button onclick="switchAdminTab('products')" class="bg-black text-white px-6 py-3 rounded-2xl text-[10px] font-black uppercase">Edit Products</button>
                <button onclick="switchAdminTab('orders')" class="bg-gray-100 text-gray-400 px-6 py-3 rounded-2xl text-[10px] font-black uppercase">Orders</button>
            </div>

            <div id="admin-products" class="adm-tab">
                <div class="bg-black p-8 rounded-[40px] mb-8 text-white">
                    <h3 class="text-[11px] font-black uppercase mb-6 opacity-60">Add/Edit Product</h3>
                    <input type="text" id="p-name" placeholder="NAME" class="text-black">
                    <input type="number" id="p-price" placeholder="PRICE" class="text-black">
                    <input type="file" id="p-file" class="bg-white/10 p-4 rounded-2xl text-[10px] w-full mb-4">
                    <button id="p-save-btn" onclick="handlePublish()" class="bg-white text-black p-5 rounded-2xl font-black text-[11px] uppercase w-full">Post Product</button>
                </div>
                <div id="admin-product-list" class="space-y-3"></div>
            </div>

            <div id="admin-orders" class="adm-tab hidden space-y-3"></div>
        </section>
    </main>

    <nav class="fixed bottom-8 left-1/2 -translate-x-1/2 w-[92%] max-w-md bg-white rounded-[40px] p-5 flex justify-around items-center z-50 nav-card shadow-2xl">
        <div onclick="showPage('home')" class="cursor-pointer text-center"><span class="block text-2xl">🏠</span></div>
        <div onclick="openAccount()" class="cursor-pointer text-center"><span class="block text-2xl">👤</span></div>
        <div onclick="openStaffPortal()" class="cursor-pointer text-center"><span class="block text-2xl">🛡️</span></div>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, setDoc, getDoc, updateDoc, deleteDoc, serverTimestamp, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC41Y6mNNBFvjNeHdOOWGsjczMjyaqoqjU",
            authDomain: "fajar-collection-8aba3.firebaseapp.com",
            projectId: "fajar-collection-8aba3",
            storageBucket: "fajar-collection-8aba3.firebasestorage.app",
            messagingSenderId: "620336064195",
            appId: "1:620336064195:web:4608ae5f133de8fa17a476"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let currentEditingId = null;
        let selectedProduct = "";

        // --- VISITOR COUNTER ---
        async function trackVisitor() {
            const vDoc = doc(db, "stats", "visitors");
            await setDoc(vDoc, { count: increment(1) }, { merge: true });
        }
        trackVisitor();

        // --- CHECKOUT LOGIC ---
        window.startCheckout = (pName) => {
            selectedProduct = pName;
            nextStep(1);
            openModal('checkoutModal');
        };

        window.nextStep = (s) => {
            [1,2,3].forEach(n => document.getElementById(`check-step-${n}`).classList.add('step-hidden'));
            document.getElementById(`check-step-${s}`).classList.remove('step-hidden');
        };

        window.submitOrder = async () => {
            await addDoc(collection(db, "orders"), {
                product: selectedProduct,
                name: document.getElementById('ord-name').value,
                wa: document.getElementById('ord-wa').value,
                gmail: document.getElementById('ord-mail').value,
                discord: document.getElementById('ord-discord').value,
                ign: document.getElementById('ord-ign').value,
                timestamp: serverTimestamp()
            });
            nextStep(3);
        };

        // --- PRODUCT EDITING ---
        window.editProduct = (id, name, price) => {
            currentEditingId = id;
            document.getElementById('p-name').value = name;
            document.getElementById('p-price').value = price;
            document.getElementById('p-save-btn').innerText = "Update Product";
            window.scrollTo(0,0);
        };

        window.handlePublish = async () => {
            const name = document.getElementById('p-name').value;
            const price = document.getElementById('p-price').value;
            const file = document.getElementById('p-file').files[0];

            if(currentEditingId) {
                await updateDoc(doc(db, "products", currentEditingId), { name, price });
                notify("Updated", "Product modified successfully.");
                currentEditingId = null;
                document.getElementById('p-save-btn').innerText = "Post Product";
            } else {
                if(!file) return alert("Select an image");
                const fd = new FormData(); fd.append("image", file);
                const r = await fetch("https://api.imgbb.com/1/upload?key=a107d2f7b3059bbb23a1b6e9f61153c7", { method: "POST", body: fd });
                const d = await r.json();
                await addDoc(collection(db, "products"), { name, price, image: d.data.url, createdAt: serverTimestamp() });
                notify("Success", "New product is live!");
            }
            document.getElementById('p-name').value = "";
            document.getElementById('p-price').value = "";
        };

        // --- STAFF LOAD ---
        onSnapshot(query(collection(db, "products"), orderBy("createdAt", "desc")), snap => {
            document.getElementById('product-grid').innerHTML = snap.docs.map(d => `
                <div class="bg-white rounded-[35px] border overflow-hidden">
                    <img src="${d.data().image}" class="w-full aspect-square object-cover">
                    <div class="p-5">
                        <p class="text-[9px] font-black uppercase opacity-20">${d.data().name}</p>
                        <p class="text-lg font-black mb-4">Rs.${d.data().price}</p>
                        <button onclick="startCheckout('${d.data().name}')" class="w-full py-4 bg-black text-white rounded-2xl text-[9px] font-black uppercase">Buy Now</button>
                    </div>
                </div>`).join('');

            document.getElementById('admin-product-list').innerHTML = snap.docs.map(d => `
                <div class="bg-white p-4 rounded-2xl flex justify-between items-center border">
                    <span class="text-[10px] font-bold">${d.data().name} (Rs.${d.data().price})</span>
                    <div class="flex gap-2">
                        <button onclick="editProduct('${d.id}', '${d.data().name}', '${d.data().price}')" class="text-blue-600 font-black text-[9px]">EDIT</button>
                        <button onclick="deleteDoc(doc(db, 'products', '${d.id}'))" class="text-red-500 font-black text-[9px]">DEL</button>
                    </div>
                </div>`).join('');
        });

        onSnapshot(doc(db, "stats", "visitors"), d => { if(d.exists()) document.getElementById('stat-visitors').innerText = d.data().count; });

        // Admin functionality, tab switching, and generic helpers...
        window.openStaffPortal = () => {
            const k = prompt("Staff Key:");
            if(k === "GHOSTYDEVELOPER") showPage('admin');
        };

        window.switchAdminTab = (t) => {
            document.querySelectorAll('.adm-tab').forEach(el => el.classList.add('hidden'));
            document.getElementById(`admin-${t}`).classList.remove('hidden');
        };

        window.openModal = id => document.getElementById(id).classList.add('active-modal');
        window.closeModal = id => document.getElementById(id).classList.remove('active-modal');
        window.showPage = id => {
            document.getElementById('page-home').classList.toggle('hidden', id !== 'home');
            document.getElementById('page-admin').classList.toggle('hidden', id !== 'admin');
        };
        window.notify = (title, msg) => { /* Reuse your Toast function from previous code */ };
    </script>
</body>
</html>
