<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMILE MC | Premium Store 💫</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fcfcfc; color: #1a1a1a; margin: 0; padding-bottom: 100px; }
        .brand-logo { font-size: 1.8rem; font-weight: 900; font-style: italic; background: linear-gradient(45deg, #00c6ff, #0072ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .modal { display: none; position: fixed; z-index: 1000; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(12px); }
        .active-modal { display: flex; align-items: center; justify-content: center; }
        .portal-card { background: white; border-radius: 35px; padding: 30px; width: 95%; max-width: 420px; max-height: 90vh; overflow-y: auto; }
        .step-hidden { display: none; }
        input { border: 1.5px solid #f3f4f6; outline: none; transition: all 0.2s; }
        input:focus { border-color: #2563eb; background: white; }
    </style>
</head>
<body>

    <div id="authModal" class="modal">
        <div class="portal-card">
            <h2 id="auth-title" class="text-xl font-black italic uppercase mb-2">Create Account</h2>
            <div id="signup-fields" class="space-y-3">
                <input type="text" id="reg-name" placeholder="FULL NAME" class="w-full p-4 bg-gray-50 rounded-2xl text-[10px] font-bold">
                <input type="text" id="reg-phone" placeholder="PHONE NUMBER" class="w-full p-4 bg-gray-50 rounded-2xl text-[10px] font-bold">
            </div>
            <div class="space-y-3 mt-3">
                <input type="email" id="auth-email" placeholder="GMAIL" class="w-full p-4 bg-gray-50 rounded-2xl text-[10px] font-bold">
                <input type="password" id="auth-pass" placeholder="PASSWORD" class="w-full p-4 bg-gray-50 rounded-2xl text-[10px] font-bold">
                <button onclick="handleAuth()" id="auth-submit-btn" class="w-full bg-black text-white py-5 rounded-2xl font-black text-[10px] uppercase tracking-widest">Register</button>
                <p onclick="toggleAuthMode()" id="auth-toggle" class="text-[9px] font-black text-center cursor-pointer opacity-40 uppercase mt-4">Sign In Instead</p>
            </div>
        </div>
    </div>

    <div id="checkoutModal" class="modal">
        <div class="portal-card">
            <div id="check-step-1">
                <h2 class="text-xl font-black italic uppercase mb-1">Order Details</h2>
                <div class="space-y-3 mt-6">
                    <input type="text" id="ord-fullname" placeholder="FULL NAME" class="w-full p-4 bg-gray-50 rounded-2xl text-[10px] font-bold">
                    <input type="text" id="ord-discord" placeholder="DISCORD ID" class="w-full p-4 bg-gray-50 rounded-2xl text-[10px] font-bold">
                    <input type="text" id="ord-whatsapp" placeholder="WHATSAPP" class="w-full p-4 bg-gray-50 rounded-2xl text-[10px] font-bold">
                    <input type="text" id="ord-ign" placeholder="MINECRAFT IGN" class="w-full p-4 bg-gray-50 rounded-2xl text-[10px] font-bold">
                    
                    <div id="custom-rank-container" class="hidden">
                        <input type="text" id="ord-customrank" placeholder="ENTER DESIRED RANK NAME" class="w-full p-4 bg-blue-50 border-blue-100 rounded-2xl text-[10px] font-black text-blue-600">
                    </div>

                    <button onclick="nextStep(2)" class="w-full bg-black text-white py-5 rounded-2xl font-black text-[10px] uppercase tracking-widest mt-2">Continue</button>
                </div>
            </div>

            <div id="check-step-2" class="step-hidden">
                <h2 class="text-xl font-black italic uppercase mb-1">Payment</h2>
                <div class="bg-blue-600 p-6 rounded-3xl text-white my-6">
                    <p class="text-[8px] font-black opacity-70 uppercase mb-2">Easypaisa: Tehmina Ahtisham</p>
                    <p class="text-xl font-black">03106723295</p>
                    <button onclick="copyText('03106723295')" class="mt-4 text-[9px] font-black bg-white/20 px-4 py-2 rounded-full">COPY</button>
                </div>
                <button onclick="submitOrder()" class="w-full bg-black text-white py-5 rounded-2xl font-black text-[11px] uppercase tracking-widest">I Have Paid</button>
            </div>

            <div id="check-step-3" class="step-hidden text-center">
                <h2 class="text-xl font-black italic mb-4 uppercase text-green-500">Success!</h2>
                <p class="text-[10px] font-bold opacity-60 mb-6 px-4">Order logged. Send screenshot to admin on WhatsApp.</p>
                <a href="https://wa.me/923706116030" target="_blank" class="block w-full bg-green-500 text-white py-4 rounded-2xl font-black text-[10px] uppercase">WhatsApp Admin</a>
                <button onclick="closeModal('checkoutModal')" class="mt-4 text-[9px] font-black opacity-30">CLOSE</button>
            </div>
        </div>
    </div>

    <div id="adminAuthModal" class="modal">
        <div class="portal-card text-center">
            <h2 class="text-xl font-black italic uppercase mb-6">Staff Only</h2>
            <input type="password" id="admin-pass-input" placeholder="ACCESS KEY" class="w-full p-5 bg-gray-50 rounded-2xl text-center font-black mb-6">
            <button onclick="verifyAdmin()" class="w-full bg-blue-600 text-white py-5 rounded-2xl font-black text-[10px]">UNLOCK</button>
        </div>
    </div>

    <header class="p-6 md:px-12 flex justify-between items-center sticky top-0 bg-white/90 backdrop-blur-md z-50">
        <h1 class="brand-logo">SMILE MC 💫</h1>
        <div id="user-display" class="text-[9px] font-black uppercase bg-black text-white px-5 py-2 rounded-full">Guest</div>
    </header>

    <main class="p-6 md:px-12 max-w-7xl mx-auto">
        <section id="page-home">
            <div id="product-grid" class="grid grid-cols-2 md:grid-cols-4 gap-6"></div>
        </section>

        <section id="page-admin" class="hidden">
            <div class="flex gap-2 mb-8 overflow-x-auto pb-2">
                <button onclick="switchAdminTab('inventory')" class="admin-btn bg-black text-white px-6 py-3 rounded-full text-[9px] font-black uppercase">Inventory</button>
                <button onclick="switchAdminTab('orders')" class="admin-btn bg-gray-100 px-6 py-3 rounded-full text-[9px] font-black uppercase">Orders</button>
                <button onclick="switchAdminTab('users')" class="admin-btn bg-gray-100 px-6 py-3 rounded-full text-[9px] font-black uppercase">Accounts</button>
            </div>

            <div class="grid grid-cols-2 gap-4 mb-8">
                <div class="bg-blue-50 p-6 rounded-[30px] border border-blue-100">
                    <p class="text-[9px] font-black uppercase opacity-40">Visitors</p>
                    <h3 id="stat-v" class="text-2xl font-black">0</h3>
                </div>
                <div class="bg-purple-50 p-6 rounded-[30px] border border-purple-100">
                    <p class="text-[9px] font-black uppercase opacity-40">Total Accounts</p>
                    <h3 id="stat-u" class="text-2xl font-black">0</h3>
                </div>
            </div>

            <div id="tab-inventory" class="adm-tab">
                <div class="bg-white p-6 rounded-3xl border mb-6">
                    <h3 class="text-[10px] font-black mb-4 uppercase text-blue-600">Post Item</h3>
                    <div class="space-y-2">
                        <input type="text" id="p-name" placeholder="ITEM NAME" class="w-full p-4 bg-gray-50 rounded-xl text-[10px] font-bold">
                        <input type="number" id="p-price" placeholder="PRICE" class="w-full p-4 bg-gray-50 rounded-xl text-[10px] font-bold">
                        <input type="file" id="p-file" class="text-[10px] font-bold">
                        <button onclick="handlePublish()" class="w-full bg-blue-600 text-white py-4 rounded-xl font-black text-[10px] uppercase">Post Product</button>
                    </div>
                </div>
                <div id="inventory-list" class="space-y-2"></div>
            </div>

            <div id="tab-orders" class="adm-tab hidden space-y-4"></div>
            <div id="tab-users" class="adm-tab hidden space-y-2"></div>
        </section>
    </main>

    <nav class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-md bg-white/90 backdrop-blur-md border shadow-2xl rounded-[30px] p-4 flex justify-around items-center z-50">
        <div onclick="showPage('home')" class="cursor-pointer text-center"><span class="block text-xl">🏠</span><span class="text-[8px] font-black uppercase">Home</span></div>
        <div onclick="openModal('authModal')" class="cursor-pointer text-center"><span class="block text-xl">👤</span><span class="text-[8px] font-black uppercase">Account</span></div>
        <div onclick="openModal('adminAuthModal')" class="cursor-pointer text-center"><span class="block text-xl">⚙️</span><span class="text-[8px] font-black uppercase">Staff</span></div>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, setDoc, deleteDoc, serverTimestamp, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC41Y6mNNBFvjNeHdOOWGsjczMjyaqoqjU",
            authDomain: "fajar-collection-8aba3.firebaseapp.com",
            projectId: "fajar-collection-8aba3",
            storageBucket: "fajar-collection-8aba3.firebasestorage.app",
            messagingSenderId: "620336064195",
            appId: "1:620336064195:web:4608ae5f133de8fa17a476"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let currentUser = null;
        let isSignUp = true;
        let selectedProduct = "";

        // Track Visitors
        const trackVisit = async () => { await setDoc(doc(db, "stats", "site"), { visitors: increment(1) }, { merge: true }); };
        trackVisit();

        // Auth Functions
        window.toggleAuthMode = () => {
            isSignUp = !isSignUp;
            document.getElementById('auth-title').innerText = isSignUp ? "Create Account" : "Sign In";
            document.getElementById('auth-submit-btn').innerText = isSignUp ? "Register" : "Login";
            document.getElementById('signup-fields').style.display = isSignUp ? 'block' : 'none';
        };

        window.handleAuth = async () => {
            const email = document.getElementById('auth-email').value;
            const pass = document.getElementById('auth-pass').value;
            try {
                if (isSignUp) {
                    const res = await createUserWithEmailAndPassword(auth, email, pass);
                    await setDoc(doc(db, "users", res.user.uid), { name: document.getElementById('reg-name').value, phone: document.getElementById('reg-phone').value, email, createdAt: serverTimestamp() });
                    await setDoc(doc(db, "stats", "site"), { accounts: increment(1) }, { merge: true });
                } else { await signInWithEmailAndPassword(auth, email, pass); }
                closeModal('authModal');
            } catch (e) { alert(e.message); }
        };

        onAuthStateChanged(auth, user => {
            currentUser = user;
            document.getElementById('user-display').innerText = user ? "Active Account" : "Guest";
        });

        // Checkout Logic
        window.startCheckout = (pName) => {
            if (!currentUser) return openModal('authModal');
            selectedProduct = pName;
            
            // Logic for Custom Rank placeholder
            const rankDiv = document.getElementById('custom-rank-container');
            if(pName.toUpperCase().includes("CUSTOMRANK") || pName.toUpperCase().includes("RANK")) {
                rankDiv.classList.remove('hidden');
            } else {
                rankDiv.classList.add('hidden');
                document.getElementById('ord-customrank').value = "";
            }
            
            openModal('checkoutModal');
            nextStep(1);
        };

        window.submitOrder = async () => {
            const orderData = {
                product: selectedProduct,
                customer: document.getElementById('ord-fullname').value,
                ign: document.getElementById('ord-ign').value,
                wa: document.getElementById('ord-whatsapp').value,
                discord: document.getElementById('ord-discord').value,
                rankName: document.getElementById('ord-customrank').value || "N/A",
                timestamp: serverTimestamp()
            };
            if(!orderData.customer || !orderData.ign) return alert("Missing Info");
            await addDoc(collection(db, "orders"), orderData);
            nextStep(3);
        };

        // Admin Functions
        window.verifyAdmin = () => {
            if (document.getElementById('admin-pass-input').value === "GHOSTYDEVELOPER") {
                closeModal('adminAuthModal');
                showPage('admin');
                loadAdminData();
            } else alert("Wrong Key");
        };

        function loadAdminData() {
            onSnapshot(doc(db, "stats", "site"), d => {
                document.getElementById('stat-v').innerText = d.data()?.visitors || 0;
                document.getElementById('stat-u').innerText = d.data()?.accounts || 0;
            });

            onSnapshot(query(collection(db, "orders"), orderBy("timestamp", "desc")), snap => {
                document.getElementById('tab-orders').innerHTML = snap.docs.map(d => {
                    const o = d.data();
                    return `<div class="bg-white p-5 rounded-3xl border border-gray-100 shadow-sm relative">
                        <button onclick="deleteOrder('${d.id}')" class="absolute top-4 right-4 text-red-500 font-black text-[9px]">DELETE</button>
                        <p class="text-blue-600 font-black uppercase text-[10px] mb-2">${o.product}</p>
                        <div class="grid grid-cols-2 gap-2 text-[9px] font-bold">
                            <p><b>IGN:</b> ${o.ign}</p>
                            <p><b>NAME:</b> ${o.customer}</p>
                            <p><b>WA:</b> ${o.wa}</p>
                            <p><b>DISCORD:</b> ${o.discord}</p>
                            ${o.rankName !== "N/A" ? `<p class="col-span-2 text-blue-500"><b>RANK NAME:</b> ${o.rankName}</p>` : ''}
                        </div>
                    </div>`;
                }).join('');
            });

            onSnapshot(collection(db, "users"), snap => {
                document.getElementById('tab-users').innerHTML = snap.docs.map(d => {
                    const u = d.data();
                    return `<div class="bg-gray-50 p-3 rounded-xl flex justify-between items-center text-[9px] font-black">
                        <span>${u.name || u.email}</span>
                        <span class="text-blue-600">${u.phone || 'NO PHONE'}</span>
                    </div>`;
                }).join('');
            });
        }

        window.deleteOrder = async (id) => { if(confirm("Delete this order?")) await deleteDoc(doc(db, "orders", id)); };

        window.handlePublish = async () => {
            const name = document.getElementById('p-name').value;
            const price = document.getElementById('p-price').value;
            const file = document.getElementById('p-file').files[0];
            if(!name || !file) return;

            const fd = new FormData(); fd.append("image", file);
            const r = await fetch("https://api.imgbb.com/1/upload?key=a107d2f7b3059bbb23a1b6e9f61153c7", { method: "POST", body: fd });
            const d = await r.json();
            
            await addDoc(collection(db, "products"), { name, price, image: d.data.url, createdAt: serverTimestamp() });
            alert("Live!");
        };

        onSnapshot(query(collection(db, "products"), orderBy("createdAt", "desc")), snap => {
            document.getElementById('product-grid').innerHTML = snap.docs.map(d => {
                const p = d.data();
                return `<div class="bg-white rounded-[40px] overflow-hidden border border-gray-100 flex flex-col h-full">
                    <img src="${p.image}" class="aspect-square object-cover">
                    <div class="p-5 flex-1 flex flex-col justify-between">
                        <div><h4 class="text-[11px] font-black uppercase italic">${p.name}</h4><p class="text-lg font-black text-blue-600">Rs.${p.price}</p></div>
                        <button onclick="startCheckout('${p.name}')" class="w-full mt-4 py-4 bg-black text-white rounded-2xl text-[9px] font-black uppercase">Buy Now</button>
                    </div>
                </div>`;
            }).join('');
        });

        // UI HELPERS
        window.nextStep = (s) => { [1,2,3].forEach(n => document.getElementById(`check-step-${n}`).classList.add('step-hidden')); document.getElementById(`check-step-${s}`).classList.remove('step-hidden'); };
        window.showPage = id => { document.querySelectorAll('main > section').forEach(s => s.classList.add('hidden')); document.getElementById(`page-${id}`).classList.remove('hidden'); };
        window.openModal = id => document.getElementById(id).classList.add('active-modal');
        window.closeModal = id => document.getElementById(id).classList.remove('active-modal');
        window.copyText = t => { navigator.clipboard.writeText(t); alert("Copied!"); };
        window.switchAdminTab = tab => {
            document.querySelectorAll('.adm-tab').forEach(t => t.classList.add('hidden'));
            document.getElementById(`tab-${tab}`).classList.remove('hidden');
        };

        showPage('home');
    </script>
</body>
</html>
