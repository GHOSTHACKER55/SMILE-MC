<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMILE MC | Premium 💫</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fcfcfc; color: #1a1a1a; margin: 0; padding-bottom: 100px; }
        .brand-logo { font-size: 2rem; font-weight: 900; font-style: italic; background: linear-gradient(45deg, #00c6ff, #0072ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .modal { display: none; position: fixed; z-index: 1000; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); }
        .active-modal { display: flex; align-items: center; justify-content: center; }
        .portal-card { background: white; border-radius: 35px; padding: 30px; width: 95%; max-width: 420px; max-height: 85vh; overflow-y: auto; }
        .step-hidden { display: none; }
        .nav-active { color: #2563eb; }
        input, textarea { border: 1px solid #e5e7eb; outline: none; transition: border 0.2s; }
        input:focus { border-color: #2563eb; }
    </style>
</head>
<body>

    <div id="authModal" class="modal">
        <div class="portal-card">
            <h2 id="auth-title" class="text-xl font-black italic uppercase mb-4">Create Account</h2>
            <div id="signup-fields" class="space-y-3">
                <input type="text" id="reg-name" placeholder="FULL NAME" class="w-full p-4 bg-gray-50 rounded-xl text-[10px] font-bold">
                <input type="text" id="reg-phone" placeholder="PHONE NUMBER" class="w-full p-4 bg-gray-50 rounded-xl text-[10px] font-bold">
            </div>
            <div class="space-y-3 mt-3">
                <input type="email" id="auth-email" placeholder="GMAIL ADDRESS" class="w-full p-4 bg-gray-50 rounded-xl text-[10px] font-bold">
                <input type="password" id="auth-pass" placeholder="PASSWORD" class="w-full p-4 bg-gray-50 rounded-xl text-[10px] font-bold">
                <input type="password" id="auth-confirm-pass" placeholder="CONFIRM PASSWORD" class="w-full p-4 bg-gray-50 rounded-xl text-[10px] font-bold signup-only">
                <button onclick="handleAuth()" id="auth-submit-btn" class="w-full bg-black text-white py-4 rounded-xl font-black text-[10px] uppercase tracking-widest">Register Now</button>
                <p onclick="toggleAuthMode()" id="auth-toggle" class="text-[9px] font-bold text-center cursor-pointer opacity-50 uppercase">Already have an account? Sign In</p>
            </div>
        </div>
    </div>

    <div id="checkoutModal" class="modal">
        <div class="portal-card">
            <div id="check-step-1">
                <h2 class="text-xl font-black italic uppercase mb-1">Order Info</h2>
                <p class="text-[9px] font-bold opacity-40 mb-6 uppercase">Fill details to proceed</p>
                <div class="space-y-3">
                    <input type="text" id="ord-fullname" placeholder="FULL NAME" class="w-full p-4 bg-gray-50 rounded-xl text-[10px] font-bold">
                    <input type="text" id="ord-discord" placeholder="DISCORD ID" class="w-full p-4 bg-gray-50 rounded-xl text-[10px] font-bold">
                    <input type="text" id="ord-whatsapp" placeholder="WHATSAPP NUMBER" class="w-full p-4 bg-gray-50 rounded-xl text-[10px] font-bold">
                    <input type="text" id="ord-ign" placeholder="MINECRAFT IGN" class="w-full p-4 bg-gray-50 rounded-xl text-[10px] font-bold">
                    <button onclick="nextStep(2)" class="w-full bg-black text-white py-4 rounded-xl font-black text-[10px] uppercase tracking-widest">Proceed to Payment</button>
                </div>
            </div>

            <div id="check-step-2" class="step-hidden">
                <h2 class="text-xl font-black italic uppercase mb-1">Payment</h2>
                <div class="bg-blue-600 p-6 rounded-3xl text-white my-6">
                    <p class="text-[8px] font-bold opacity-80 uppercase">Easypaisa (Tehmina Ahtisham)</p>
                    <p class="text-xl font-black mt-1">03106723295</p>
                    <button onclick="navigator.clipboard.writeText('03106723295'); alert('Copied!')" class="mt-3 text-[8px] font-black bg-white/20 px-3 py-1 rounded-lg">COPY NUMBER</button>
                </div>
                <button onclick="submitOrder()" class="w-full bg-black text-white py-4 rounded-xl font-black text-[10px] uppercase">I Have Paid</button>
            </div>

            <div id="check-step-3" class="step-hidden text-center">
                <div class="text-4xl mb-4">✅</div>
                <h2 class="text-xl font-black italic uppercase mb-2">Order Placed</h2>
                <p class="text-[10px] font-bold opacity-60 mb-6">Send screenshot to admin to activate.</p>
                <div class="space-y-2">
                    <a href="https://wa.me/923706116030" class="block bg-green-500 text-white py-4 rounded-xl font-black text-[10px] uppercase">WhatsApp Admin</a>
                    <button onclick="closeModal('checkoutModal')" class="w-full bg-gray-100 py-4 rounded-xl font-black text-[10px] uppercase">Close</button>
                </div>
            </div>
        </div>
    </div>

    <div id="adminAuthModal" class="modal">
        <div class="portal-card text-center">
            <h2 class="text-xl font-black italic mb-6">STAFF ONLY</h2>
            <input type="password" id="admin-pass-input" placeholder="ENTER KEY" class="w-full p-4 bg-gray-50 rounded-xl text-center font-bold mb-4">
            <button onclick="verifyAdmin()" class="w-full bg-blue-600 text-white py-4 rounded-xl font-black text-[10px]">UNLOCK PANEL</button>
        </div>
    </div>

    <header class="p-6 flex justify-between items-center sticky top-0 bg-white/80 backdrop-blur-md z-40">
        <h1 class="brand-logo">SMILE MC 💫</h1>
        <div id="user-display" class="text-[9px] font-black uppercase bg-gray-100 px-4 py-2 rounded-full">Guest</div>
    </header>

    <main class="p-6 max-w-7xl mx-auto">
        <section id="page-home">
            <div id="product-grid" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
        </section>

        <section id="page-admin" class="hidden">
            <div class="flex gap-4 mb-8 overflow-x-auto pb-2">
                <button onclick="switchAdminTab('inventory')" class="whitespace-nowrap bg-black text-white px-6 py-3 rounded-full text-[10px] font-black uppercase">Inventory</button>
                <button onclick="switchAdminTab('orders')" class="whitespace-nowrap bg-gray-100 px-6 py-3 rounded-full text-[10px] font-black uppercase">Orders</button>
                <button onclick="switchAdminTab('users')" class="whitespace-nowrap bg-gray-100 px-6 py-3 rounded-full text-[10px] font-black uppercase">Accounts</button>
            </div>

            <div id="admin-stats" class="grid grid-cols-2 gap-4 mb-8">
                <div class="bg-blue-50 p-6 rounded-[30px] border border-blue-100">
                    <p class="text-[9px] font-black uppercase opacity-40">Total Visitors</p>
                    <h3 id="stat-v" class="text-2xl font-black italic">0</h3>
                </div>
                <div class="bg-purple-50 p-6 rounded-[30px] border border-purple-100">
                    <p class="text-[9px] font-black uppercase opacity-40">Accounts</p>
                    <h3 id="stat-u" class="text-2xl font-black italic">0</h3>
                </div>
            </div>

            <div id="tab-inventory" class="admin-tab">
                <div class="bg-white p-6 rounded-3xl border mb-6">
                    <input type="text" id="p-name" placeholder="ITEM NAME" class="w-full p-3 mb-2 rounded-lg text-[10px] font-bold">
                    <input type="number" id="p-price" placeholder="PRICE" class="w-full p-3 mb-2 rounded-lg text-[10px] font-bold">
                    <input type="file" id="p-file" class="text-[10px] mb-4">
                    <button onclick="handlePublish()" class="w-full bg-blue-600 text-white py-4 rounded-xl font-black text-[10px]">POST PRODUCT</button>
                </div>
                <div id="inventory-list" class="space-y-2"></div>
            </div>

            <div id="tab-orders" class="admin-tab hidden space-y-3"></div>
            <div id="tab-users" class="admin-tab hidden space-y-3"></div>
        </section>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t p-4 flex justify-around items-center z-50">
        <button onclick="showPage('home')" class="flex flex-col items-center"><span class="text-xl">🏠</span><span class="text-[8px] font-bold uppercase">Home</span></button>
        <button onclick="openModal('authModal')" class="flex flex-col items-center"><span class="text-xl">👤</span><span class="text-[8px] font-bold uppercase">Profile</span></button>
        <button onclick="openModal('adminAuthModal')" class="flex flex-col items-center"><span class="text-xl">⚙️</span><span class="text-[8px] font-bold uppercase">Staff</span></button>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, setDoc, getDocs, serverTimestamp, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC41Y6mNNBFvjNeHdOOWGsjczMjyaqoqjU",
            authDomain: "fajar-collection-8aba3.firebaseapp.com",
            projectId: "fajar-collection-8aba3",
            storageBucket: "fajar-collection-8aba3.firebasestorage.app",
            messagingSenderId: "620336064195",
            appId: "1:620336064195:web:4608ae5f133de8fa17a476"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let currentUser = null;
        let isSignUp = true;
        let selectedProduct = null;

        // Visitor Count
        const trackVisit = async () => { await setDoc(doc(db, "stats", "site"), { visitors: increment(1) }, { merge: true }); };
        trackVisit();

        // AUTH LOGIC
        window.toggleAuthMode = () => {
            isSignUp = !isSignUp;
            document.getElementById('auth-title').innerText = isSignUp ? "Create Account" : "Sign In";
            document.getElementById('auth-submit-btn').innerText = isSignUp ? "Register Now" : "Sign In";
            document.querySelectorAll('.signup-only, #signup-fields').forEach(el => el.style.display = isSignUp ? 'block' : 'none');
        };

        window.handleAuth = async () => {
            const email = document.getElementById('auth-email').value;
            const pass = document.getElementById('auth-pass').value;
            const name = document.getElementById('reg-name').value;
            const phone = document.getElementById('reg-phone').value;

            try {
                if (isSignUp) {
                    const res = await createUserWithEmailAndPassword(auth, email, pass);
                    await setDoc(doc(db, "users", res.user.uid), { name, phone, email, createdAt: serverTimestamp() });
                    await setDoc(doc(db, "stats", "site"), { accounts: increment(1) }, { merge: true });
                } else {
                    await signInWithEmailAndPassword(auth, email, pass);
                }
                closeModal('authModal');
            } catch (e) { alert(e.message); }
        };

        onAuthStateChanged(auth, user => {
            currentUser = user;
            document.getElementById('user-display').innerText = user ? "Logged In" : "Guest";
        });

        // ORDER LOGIC
        window.startCheckout = (pName) => {
            if (!currentUser) return openModal('authModal');
            selectedProduct = pName;
            openModal('checkoutModal');
            nextStep(1);
        };

        window.submitOrder = async () => {
            const orderData = {
                product: selectedProduct,
                customerName: document.getElementById('ord-fullname').value,
                discord: document.getElementById('ord-discord').value,
                whatsapp: document.getElementById('ord-whatsapp').value,
                ign: document.getElementById('ord-ign').value,
                timestamp: serverTimestamp(),
                status: 'Pending'
            };
            await addDoc(collection(db, "orders"), orderData);
            nextStep(3);
        };

        // ADMIN LOGIC
        window.verifyAdmin = () => {
            if (document.getElementById('admin-pass-input').value === "GHOSTYDEVELOPER") {
                closeModal('adminAuthModal');
                showPage('admin');
                loadAdminData();
            } else alert("INVALID KEY");
        };

        function loadAdminData() {
            // Stats
            onSnapshot(doc(db, "stats", "site"), d => {
                document.getElementById('stat-v').innerText = d.data().visitors;
                document.getElementById('stat-u').innerText = d.data().accounts;
            });
            // Orders
            onSnapshot(query(collection(db, "orders"), orderBy("timestamp", "desc")), snap => {
                document.getElementById('tab-orders').innerHTML = snap.docs.map(d => {
                    const o = d.data();
                    return `<div class="bg-white p-4 rounded-2xl border text-[10px]">
                        <p class="font-black text-blue-600 uppercase mb-2">${o.product}</p>
                        <p><b>NAME:</b> ${o.customerName}</p>
                        <p><b>IGN:</b> ${o.ign}</p>
                        <p><b>WA:</b> ${o.whatsapp}</p>
                        <p><b>DISCORD:</b> ${o.discord}</p>
                    </div>`;
                }).join('');
            });
            // Accounts
            onSnapshot(collection(db, "users"), snap => {
                document.getElementById('tab-users').innerHTML = snap.docs.map(d => {
                    const u = d.data();
                    return `<div class="bg-white p-4 rounded-2xl border text-[10px]">
                        <p class="font-black uppercase">${u.name}</p>
                        <p class="opacity-60">${u.email}</p>
                        <p class="font-bold text-blue-500">${u.phone}</p>
                    </div>`;
                }).join('');
            });
        }

        // UI HELPERS
        window.nextStep = (s) => {
            [1, 2, 3].forEach(n => document.getElementById(`check-step-${n}`).classList.add('step-hidden'));
            document.getElementById(`check-step-${s}`).classList.remove('step-hidden');
        };
        window.showPage = id => {
            document.querySelectorAll('main > section').forEach(s => s.classList.add('hidden'));
            document.getElementById(`page-${id}`).classList.remove('hidden');
        };
        window.openModal = id => document.getElementById(id).classList.add('active-modal');
        window.closeModal = id => document.getElementById(id).classList.remove('active-modal');
        window.switchAdminTab = (tab) => {
            document.querySelectorAll('.admin-tab').forEach(t => t.classList.add('hidden'));
            document.getElementById(`tab-${tab}`).classList.remove('hidden');
        };

        // RENDER PRODUCTS
        onSnapshot(query(collection(db, "products"), orderBy("createdAt", "desc")), snap => {
            document.getElementById('product-grid').innerHTML = snap.docs.map(d => {
                const p = d.data();
                return `<div class="bg-white rounded-[30px] overflow-hidden border border-gray-100 flex flex-col">
                    <img src="${p.image}" class="aspect-square object-cover">
                    <div class="p-4 flex-1 flex flex-col justify-between">
                        <div>
                            <h4 class="text-[11px] font-black uppercase italic">${p.name}</h4>
                            <p class="text-sm font-bold text-gray-800">Rs.${p.price}</p>
                        </div>
                        <button onclick="startCheckout('${p.name}')" class="w-full mt-3 py-3 border-2 border-black rounded-xl text-[9px] font-black uppercase hover:bg-black hover:text-white transition-all">Buy Now</button>
                    </div>
                </div>`;
            }).join('');
        });

        // HANDLE PRODUCT PUBLISH
        window.handlePublish = async () => {
            const name = document.getElementById('p-name').value;
            const price = document.getElementById('p-price').value;
            const file = document.getElementById('p-file').files[0];
            if(!name || !file) return alert("Missing Info");

            const fd = new FormData(); fd.append("image", file);
            const r = await fetch("https://api.imgbb.com/1/upload?key=a107d2f7b3059bbb23a1b6e9f61153c7", { method: "POST", body: fd });
            const d = await r.json();
            
            await addDoc(collection(db, "products"), { name, price, image: d.data.url, createdAt: serverTimestamp() });
            alert("Product Added!");
        };

    </script>
</body>
</html>
