<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMILE MC | Premium Store 👑</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fcfcfc; color: #1a1a1a; margin: 0; padding-bottom: 100px; }
        
        /* BOLD TITLE */
        .brand-logo { font-size: 1.7rem; font-weight: 900; font-style: italic; text-transform: uppercase; background: linear-gradient(45deg, #00c6ff, #0072ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .modal { display: none; position: fixed; z-index: 1000; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(12px); }
        .active-modal { display: flex; align-items: center; justify-content: center; }
        .portal-card { background: white; border-radius: 35px; padding: 30px; width: 95%; max-width: 420px; max-height: 90vh; overflow-y: auto; }
        .step-hidden { display: none; }
        input { border: 1.5px solid #f3f4f6; outline: none; transition: all 0.2s; border-radius: 15px; }
        input:focus { border-color: #2563eb; background: white; }

        /* BACK BUTTON STYLE */
        .dynamic-back { display: none; cursor: pointer; font-size: 1.4rem; font-weight: 900; color: #000; margin-right: 15px; }
    </style>
</head>
<body>

    <div id="authModal" class="modal">
        <div class="portal-card">
            <h2 id="auth-title" class="text-xl font-black italic uppercase mb-2 text-blue-600">Account Access</h2>
            <div id="signup-fields" class="space-y-3">
                <input type="text" id="reg-name" placeholder="FULL NAME" class="w-full p-4 bg-gray-50 text-[10px] font-bold">
                <input type="text" id="reg-phone" placeholder="PHONE NUMBER" class="w-full p-4 bg-gray-50 text-[10px] font-bold">
            </div>
            <div class="space-y-3 mt-3">
                <input type="email" id="auth-email" placeholder="GMAIL" class="w-full p-4 bg-gray-50 text-[10px] font-bold">
                <input type="password" id="auth-pass" placeholder="PASSWORD" class="w-full p-4 bg-gray-50 text-[10px] font-bold">
                <button onclick="handleAuth()" id="auth-submit-btn" class="w-full bg-black text-white py-5 rounded-2xl font-black text-[10px] uppercase tracking-widest">Submit</button>
                <p onclick="toggleAuthMode()" id="auth-toggle" class="text-[9px] font-black text-center cursor-pointer opacity-40 uppercase mt-4">Already have an account? Sign In</p>
            </div>
        </div>
    </div>

    <div id="checkoutModal" class="modal">
        <div class="portal-card">
            <div id="check-step-1">
                <div class="flex items-center mb-6">
                    <span onclick="closeModal('checkoutModal')" class="cursor-pointer text-xl font-black mr-3">←</span>
                    <h2 class="text-xl font-black italic uppercase">Order Info</h2>
                </div>
                <div class="space-y-3">
                    <input type="text" id="ord-fullname" placeholder="FULL NAME" class="w-full p-4 bg-gray-50 text-[10px] font-bold">
                    <input type="text" id="ord-discord" placeholder="DISCORD ID" class="w-full p-4 bg-gray-50 text-[10px] font-bold">
                    <input type="text" id="ord-whatsapp" placeholder="WHATSAPP" class="w-full p-4 bg-gray-50 text-[10px] font-bold">
                    <input type="text" id="ord-ign" placeholder="MINECRAFT IGN" class="w-full p-4 bg-gray-50 text-[10px] font-bold">
                    <div id="custom-rank-container" class="hidden">
                        <input type="text" id="ord-customrank" placeholder="ENTER YOUR CUSTOM RANK NAME" class="w-full p-4 bg-blue-50 border-blue-100 text-[10px] font-black text-blue-600">
                    </div>
                    <button onclick="nextStep(2)" class="w-full bg-black text-white py-5 rounded-2xl font-black text-[10px] uppercase mt-2">Proceed to Payment</button>
                </div>
            </div>

            <div id="check-step-2" class="step-hidden">
                <span onclick="nextStep(1)" class="cursor-pointer text-xl font-black block mb-4">← BACK</span>
                <h2 class="text-xl font-black italic uppercase">Payment</h2>
                <div class="bg-blue-600 p-6 rounded-3xl text-white my-6">
                    <p class="text-[8px] font-black opacity-70 uppercase mb-2">Easypaisa: Tehmina Ahtisham</p>
                    <p class="text-xl font-black">03106723295</p>
                </div>
                <button onclick="submitOrder()" class="w-full bg-black text-white py-5 rounded-2xl font-black text-[11px] uppercase">I Have Paid</button>
            </div>

            <div id="check-step-3" class="step-hidden text-center py-4">
                <h2 class="text-2xl font-black italic mb-4 uppercase text-green-500">Order Placed</h2>
                <a href="https://wa.me/923706116030" target="_blank" class="block w-full bg-green-500 text-white py-4 rounded-2xl font-black text-[10px] uppercase">WhatsApp Admin</a>
            </div>
        </div>
    </div>

    <header class="p-6 md:px-12 flex items-center sticky top-0 bg-white/95 backdrop-blur-md z-50 border-b border-gray-50">
        <div id="page-back-arrow" onclick="showPage('home')" class="dynamic-back">←</div>
        <h1 class="brand-logo">SMILE MC 👑</h1>
    </header>

    <main class="p-6 md:px-12 max-w-7xl mx-auto">
        <section id="page-home">
            <div id="product-grid" class="grid grid-cols-2 md:grid-cols-4 gap-6"></div>
        </section>

        <section id="page-admin" class="hidden">
            <div class="flex gap-2 mb-8 overflow-x-auto pb-4 no-scrollbar">
                <button onclick="switchAdminTab('inventory')" class="adm-btn bg-black text-white px-8 py-3 rounded-full text-[9px] font-black uppercase shadow-md">Products</button>
                <button onclick="switchAdminTab('orders')" class="adm-btn bg-gray-100 px-8 py-3 rounded-full text-[9px] font-black uppercase">Orders</button>
                <button onclick="switchAdminTab('users')" class="adm-btn bg-gray-100 px-8 py-3 rounded-full text-[9px] font-black uppercase">User Passwords</button>
            </div>

            <div id="tab-inventory" class="adm-tab">
                <div class="bg-white p-6 rounded-3xl border mb-6">
                    <input type="text" id="p-name" placeholder="PRODUCT NAME" class="w-full p-4 bg-gray-50 text-[10px] font-bold mb-2">
                    <input type="number" id="p-price" placeholder="PRICE" class="w-full p-4 bg-gray-50 text-[10px] font-bold mb-2">
                    <input type="file" id="p-file" class="text-[10px] mb-4">
                    <button onclick="handlePublish()" class="w-full bg-black text-white py-4 rounded-2xl font-black text-[10px] uppercase">Post Product</button>
                </div>
                <div id="inventory-list" class="space-y-2"></div>
            </div>

            <div id="tab-orders" class="adm-tab hidden space-y-4"></div>

            <div id="tab-users" class="adm-tab hidden space-y-3"></div>
        </section>
    </main>

    <nav class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-md bg-white/95 backdrop-blur-md border shadow-2xl rounded-[40px] p-5 flex justify-around items-center z-50">
        <div onclick="showPage('home')" class="cursor-pointer text-center">🏠<p class="text-[8px] font-black uppercase">Store</p></div>
        <div onclick="openModal('authModal')" class="cursor-pointer text-center">👤<p class="text-[8px] font-black uppercase">Login</p></div>
        <div onclick="openAdmin()" class="cursor-pointer text-center">🛡️<p class="text-[8px] font-black uppercase">Admin</p></div>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, setDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC41Y6mNNBFvjNeHdOOWGsjczMjyaqoqjU",
            authDomain: "fajar-collection-8aba3.firebaseapp.com",
            projectId: "fajar-collection-8aba3",
            storageBucket: "fajar-collection-8aba3.firebasestorage.app",
            messagingSenderId: "620336064195",
            appId: "1:620336064195:web:4608ae5f133de8fa17a476"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let currentUser = null;
        let isSignUp = true;
        let selectedProduct = "";

        // AUTH
        window.handleAuth = async () => {
            const email = document.getElementById('auth-email').value;
            const pass = document.getElementById('auth-pass').value;
            try {
                if (isSignUp) {
                    const res = await createUserWithEmailAndPassword(auth, email, pass);
                    await setDoc(doc(db, "users", res.user.uid), { 
                        name: document.getElementById('reg-name').value, 
                        email, 
                        phone: document.getElementById('reg-phone').value,
                        password: pass // STORED FOR ADMIN VIEW
                    });
                } else { await signInWithEmailAndPassword(auth, email, pass); }
                closeModal('authModal');
            } catch (e) { alert(e.message); }
        };

        onAuthStateChanged(auth, user => { currentUser = user; });

        // DYNAMIC PAGE NAVIGATION (Back button control)
        window.showPage = id => {
            document.querySelectorAll('main > section').forEach(s => s.classList.add('hidden'));
            document.getElementById(`page-${id}`).classList.remove('hidden');
            
            // Back button only shows if NOT on home
            document.getElementById('page-back-arrow').style.display = (id === 'home') ? 'none' : 'block';
        };

        // ADMIN
        window.openAdmin = () => {
            const key = prompt("Enter Admin Key:");
            if(key === "GHOSTYDEVELOPER") {
                showPage('admin');
                loadAdmin();
            }
        };

        function loadAdmin() {
            // USERS LIST WITH PASSWORD
            onSnapshot(collection(db, "users"), snap => {
                document.getElementById('tab-users').innerHTML = snap.docs.map(d => {
                    const u = d.data();
                    return `<div class="bg-white p-4 rounded-2xl border shadow-sm">
                        <p class="text-[10px] font-black uppercase text-blue-600">${u.name}</p>
                        <p class="text-[9px] font-bold">Email: ${u.email}</p>
                        <p class="text-[9px] font-bold text-red-500">PASSWORD: ${u.password}</p>
                    </div>`;
                }).join('');
            });

            // ORDERS
            onSnapshot(query(collection(db, "orders"), orderBy("timestamp", "desc")), snap => {
                document.getElementById('tab-orders').innerHTML = snap.docs.map(d => {
                    const o = d.data();
                    return `<div class="bg-white p-4 rounded-2xl border flex justify-between">
                        <div><p class="text-[10px] font-black uppercase">${o.product}</p><p class="text-[9px]">IGN: ${o.ign}</p></div>
                        <button onclick="deleteDoc(doc(db, 'orders', '${d.id}'))" class="text-red-500 font-black text-[8px]">DEL</button>
                    </div>`;
                }).join('');
            });
        }

        // PRODUCTS
        onSnapshot(query(collection(db, "products"), orderBy("createdAt", "desc")), snap => {
            document.getElementById('product-grid').innerHTML = snap.docs.map(d => {
                const p = d.data();
                return `<div class="bg-white rounded-[30px] overflow-hidden border shadow-sm">
                    <img src="${p.image}" class="w-full aspect-square object-cover">
                    <div class="p-4">
                        <p class="text-[10px] font-black uppercase opacity-40">${p.name}</p>
                        <p class="text-lg font-black text-blue-600">Rs.${p.price}</p>
                        <button onclick="startCheckout('${p.name}')" class="w-full mt-3 py-3 bg-black text-white rounded-xl text-[9px] font-black uppercase">Buy</button>
                    </div>
                </div>`;
            }).join('');
        });

        window.startCheckout = (pName) => {
            if(!currentUser) return openModal('authModal');
            selectedProduct = pName;
            document.getElementById('custom-rank-container').classList.toggle('hidden', !pName.toUpperCase().includes("RANK"));
            openModal('checkoutModal');
            nextStep(1);
        };

        window.submitOrder = async () => {
            await addDoc(collection(db, "orders"), { 
                product: selectedProduct, 
                ign: document.getElementById('ord-ign').value,
                wa: document.getElementById('ord-whatsapp').value,
                rankName: document.getElementById('ord-customrank').value || "N/A",
                timestamp: serverTimestamp() 
            });
            nextStep(3);
        };

        // HELPERS
        window.nextStep = s => { [1,2,3].forEach(n => document.getElementById(`check-step-${n}`).classList.add('step-hidden')); document.getElementById(`check-step-${s}`).classList.remove('step-hidden'); };
        window.openModal = id => document.getElementById(id).classList.add('active-modal');
        window.closeModal = id => document.getElementById(id).classList.remove('active-modal');
        window.switchAdminTab = t => { document.querySelectorAll('.adm-tab').forEach(tab => tab.classList.add('hidden')); document.getElementById(`tab-${t}`).classList.remove('hidden'); };
        window.handlePublish = async () => {
            const file = document.getElementById('p-file').files[0];
            const fd = new FormData(); fd.append("image", file);
            const r = await fetch("https://api.imgbb.com/1/upload?key=a107d2f7b3059bbb23a1b6e9f61153c7", { method: "POST", body: fd });
            const d = await r.json();
            await addDoc(collection(db, "products"), { name: document.getElementById('p-name').value, price: document.getElementById('p-price').value, image: d.data.url, createdAt: serverTimestamp() });
            alert("Done!");
        };

        showPage('home');
    </script>
</body>
</html>
