<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMILE MC | PREMIUM 👑</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #ffffff; color: #000; margin: 0; padding-bottom: 120px; }
        
        /* PREMIUM STAFF PORTAL STYLE */
        .staff-card { background: white; border-radius: 50px; padding: 50px 40px; width: 95%; max-width: 420px; text-align: center; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1); }
        .staff-title { font-size: 1.8rem; font-weight: 900; font-style: italic; text-transform: uppercase; letter-spacing: -1px; margin-bottom: 5px; }
        .staff-subtitle { font-size: 10px; font-weight: 800; opacity: 0.3; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 30px; }
        
        .staff-input { 
            width: 100%; padding: 20px; border-radius: 20px; border: 2.5px solid #2563eb; 
            text-align: center; font-size: 20px; letter-spacing: 8px; color: #2563eb; outline: none;
            box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.2); transition: all 0.3s ease;
        }
        
        .staff-unlock { 
            width: 100%; background: #000; color: #fff; padding: 22px; border-radius: 22px; 
            font-weight: 900; text-transform: uppercase; font-size: 12px; letter-spacing: 2px;
            margin-top: 25px; cursor: pointer; transition: transform 0.2s;
        }
        .staff-unlock:active { transform: scale(0.96); }

        /* NOTIFICATION */
        #custom-alert { display: none; position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 3000; width: 90%; max-width: 350px; background: #000; color: #fff; padding: 20px; border-radius: 25px; text-align: center; font-size: 11px; font-weight: 800; text-transform: uppercase; box-shadow: 0 20px 40px rgba(0,0,0,0.3); animation: slideDown 0.4s ease; }
        
        @keyframes slideDown { from { top: -100px; } to { top: 20px; } }
        .modal { display: none; position: fixed; z-index: 1000; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(15px); align-items: center; justify-content: center; }
        .active-modal { display: flex; }
    </style>
</head>
<body>

    <div id="custom-alert"></div>

    <div id="staffModal" class="modal">
        <div class="staff-card">
            <h2 class="staff-title">Staff Access</h2>
            <p class="staff-subtitle">Secure Portal</p>
            
            <input type="password" id="staff-key-input" class="staff-input" placeholder="••••••••">
            
            <button onclick="checkStaffKey()" class="staff-unlock">Unlock</button>
            <button onclick="closeModal('staffModal')" class="mt-6 text-[10px] font-black opacity-30 uppercase tracking-widest block w-full">Cancel</button>
        </div>
    </div>

    <header class="p-6 md:px-12 flex items-center justify-between sticky top-0 bg-white/80 backdrop-blur-md z-50">
        <div class="flex items-center">
            <div id="global-back-btn" onclick="showPage('home')" class="hidden cursor-pointer text-2xl font-black mr-4">←</div>
            <h1 class="text-2xl font-black uppercase italic tracking-tighter text-black">Smile MC 👑</h1>
        </div>
        <div id="user-pfp-container" onclick="openProfile()" class="hidden cursor-pointer">
            <img id="header-pfp" src="" class="w-10 h-10 rounded-full border-2 border-black object-cover">
        </div>
    </header>

    <main class="p-6 md:px-12 max-w-7xl mx-auto">
        <section id="page-home">
            <div id="product-grid" class="grid grid-cols-2 md:grid-cols-4 gap-6"></div>
        </section>

        <section id="page-admin" class="hidden">
            <div class="flex gap-4 mb-10 overflow-x-auto pb-2 no-scrollbar">
                <button onclick="switchAdminTab('inventory')" class="bg-black text-white px-8 py-3 rounded-full text-[10px] font-black uppercase">Store</button>
                <button onclick="switchAdminTab('users')" class="bg-gray-100 px-8 py-3 rounded-full text-[10px] font-black uppercase">Users</button>
            </div>
            <div id="tab-inventory" class="adm-tab">
                </div>
            <div id="tab-users" class="adm-tab hidden grid gap-4"></div>
        </section>
    </main>

    <nav class="fixed bottom-8 left-1/2 -translate-x-1/2 w-[90%] max-w-md bg-white/90 backdrop-blur-lg rounded-[40px] p-5 flex justify-around items-center z-50 shadow-2xl border border-gray-100">
        <div onclick="showPage('home')" class="cursor-pointer text-center">
            <img src="https://cdn-icons-png.flaticon.com/512/1946/1946488.png" class="w-6 h-6 mx-auto mb-1">
            <p class="text-[9px] font-black uppercase">Home</p>
        </div>
        <div onclick="openProfile()" class="cursor-pointer text-center">
            <img src="https://cdn-icons-png.flaticon.com/512/1077/1077063.png" class="w-6 h-6 mx-auto mb-1">
            <p class="text-[9px] font-black uppercase">Account</p>
        </div>
        <div onclick="openModal('staffModal')" class="cursor-pointer text-center">
            <img src="https://cdn-icons-png.flaticon.com/512/600/600455.png" class="w-6 h-6 mx-auto mb-1">
            <p class="text-[9px] font-black uppercase">Staff</p>
        </div>
    </nav>

    <script type="module">
        // Firebase imports here (same as previous)
        
        window.showAlert = (msg) => {
            const el = document.getElementById('custom-alert');
            // Clean Firebase error messages
            const cleanMsg = msg.replace('Firebase: Error (auth/', '').replace(').', '').replace(/-/g, ' ');
            el.innerText = cleanMsg; 
            el.style.display = "block";
            setTimeout(() => el.style.display = "none", 4000);
        };

        window.openModal = id => document.getElementById(id).classList.add('active-modal');
        window.closeModal = id => document.getElementById(id).classList.remove('active-modal');

        // STAFF KEY LOGIC
        window.checkStaffKey = () => {
            const key = document.getElementById('staff-key-input').value;
            if(key === "GHOSTYDEVELOPER") {
                closeModal('staffModal');
                showPage('admin');
                loadAdmin(); // Your existing function to load data
                showAlert("Access Granted");
            } else {
                showAlert("Invalid Staff Key", "error");
                document.getElementById('staff-key-input').value = "";
            }
        };

        // Other functions (showPage, handlePublish, updateProfile) remain the same
    </script>
</body>
</html>
