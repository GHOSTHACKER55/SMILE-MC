<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMILE MC | Dark Store</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');

*{box-sizing:border-box}

body{
 margin:0;
 font-family:'Inter',sans-serif;
 background:#0b0b0f;
 color:#fff;
 padding-bottom:110px
}

input{
 background:#14141b;
 border:1px solid #222;
 border-radius:14px;
 padding:14px;
 font-size:12px;
 color:#fff;
 width:100%
}
input::placeholder{color:#6b7280}
input:focus{outline:none;border-color:#7c7cff}

/* MODAL */
.modal{
 display:none;
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.85);
 z-index:999;
 align-items:center;
 justify-content:center
}
.modal.active{display:flex}

.card{
 background:#14141b;
 border-radius:24px;
 padding:24px;
 width:95%;
 max-width:420px
}

.step{display:none}
.step.active{display:block}

/* TOAST */
#toast{
 position:fixed;
 top:20px;
 right:20px;
 z-index:9999
}
.toast{
 background:#14141b;
 padding:14px 18px;
 border-radius:14px;
 font-size:11px;
 font-weight:800;
 text-transform:uppercase;
 margin-bottom:10px;
 animation:fade .3s ease
}
@keyframes fade{from{opacity:0;transform:translateY(-10px)}to{opacity:1}}

</style>
</head>

<body>

<div id="toast"></div>

<!-- HEADER -->
<header class="p-5 flex justify-between items-center sticky top-0 bg-[#0b0b0f] z-50">
 <h1 class="font-black text-xl tracking-tight">SMILE MC</h1>
 <span class="text-xs opacity-40" id="userStatus">Guest</span>
</header>

<!-- SEARCH -->
<div class="px-5 max-w-6xl mx-auto">
 <input id="search" placeholder="SEARCH RANK" oninput="filterProducts()"
  class="mb-8 text-xs uppercase tracking-[3px] font-bold">
</div>

<!-- PRODUCTS -->
<main id="products" class="px-5 max-w-6xl mx-auto grid grid-cols-2 md:grid-cols-4 gap-5"></main>

<!-- NAV -->
<nav class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-md bg-[#14141b] rounded-full p-5 flex justify-around text-lg">
 <span onclick="toastMsg('Home')">🏠</span>
 <span onclick="openModal('checkout')">🛒</span>
 <span onclick="toastMsg('Admin Locked')">🛡️</span>
</nav>

<!-- CHECKOUT -->
<div id="checkout" class="modal">
 <div class="card">

 <!-- STEP 1 -->
 <div class="step active" id="s1">
  <h2 class="font-black mb-4">Order Details</h2>
  <input id="n" placeholder="FULL NAME" class="mb-3">
  <input id="w" placeholder="WHATSAPP NUMBER" class="mb-3">
  <input id="e" placeholder="GMAIL" class="mb-3">
  <input id="d" placeholder="DISCORD ID" class="mb-3">
  <input id="i" placeholder="MINECRAFT IGN" class="mb-5">
  <button onclick="goStep(2)" class="w-full bg-[#7c7cff] py-4 rounded-xl font-black">
   NEXT
  </button>
 </div>

 <!-- STEP 2 -->
 <div class="step" id="s2">
  <h2 class="font-black mb-4">Payment</h2>
  <div class="bg-black rounded-xl p-4 mb-5 text-center">
   <p class="text-xs opacity-60">My Account</p>
   <p class="text-xl font-black">03106723295</p>
   <p class="text-sm">Easypaisa</p>
   <p class="font-bold">Tehmina Ahtisham</p>
  </div>
  <button onclick="goStep(3)" class="w-full bg-[#7c7cff] py-4 rounded-xl font-black">
   I HAVE PAID
  </button>
 </div>

 <!-- STEP 3 -->
 <div class="step text-center" id="s3">
  <div class="text-4xl mb-3">✅</div>
  <p class="text-sm mb-5 opacity-60">
   If you have paid, contact admin
  </p>

  <a href="https://wa.me/923706116030" target="_blank"
   class="block bg-green-600 py-4 rounded-xl font-black mb-3">
   WhatsApp Admin
  </a>

  <div class="bg-black py-3 rounded-xl text-xs font-bold">
   Discord: frostdragon._.
  </div>
 </div>

 </div>
</div>

<script>
const productData=[
 {name:"VIP Rank",price:500},
 {name:"MVP Rank",price:1000},
 {name:"Legend Rank",price:2000},
 {name:"Ultra Rank",price:3000}
];

let selected="";

function render(list){
 const p=document.getElementById("products");
 p.innerHTML=list.map(x=>`
  <div class="bg-[#14141b] rounded-2xl overflow-hidden">
   <div class="p-4">
    <p class="text-xs opacity-40 font-bold uppercase">${x.name}</p>
    <p class="text-xl font-black mb-4">Rs. ${x.price}</p>
    <button onclick="buy('${x.name}')"
     class="w-full bg-[#7c7cff] py-3 rounded-xl text-xs font-black uppercase">
     Buy Now
    </button>
   </div>
  </div>`).join("");
}
render(productData);

function filterProducts(){
 const q=search.value.toLowerCase();
 render(productData.filter(p=>p.name.toLowerCase().includes(q)));
}

function buy(n){
 selected=n;
 openModal('checkout');
 goStep(1);
}

function goStep(s){
 document.querySelectorAll(".step").forEach(x=>x.classList.remove("active"));
 document.getElementById("s"+s).classList.add("active");
 if(s===3) toastMsg("Order Submitted");
}

function openModal(id){document.getElementById(id).classList.add("active")}
window.onclick=e=>{if(e.target.classList.contains("modal"))e.target.classList.remove("active")}

function toastMsg(m){
 const t=document.createElement("div");
 t.className="toast";
 t.innerText=m;
 toast.appendChild(t);
 setTimeout(()=>t.remove(),3000);
}
</script>

</body>
</html>
