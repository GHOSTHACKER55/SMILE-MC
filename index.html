<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMILE MC | PREMIUM STORE 👑</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800;900&display=swap');

body{
 font-family:'Plus Jakarta Sans',sans-serif;
 background:#fff;
 color:#000;
 margin:0;
 padding-bottom:100px
}

.brand-logo{
 font-size:1.6rem;
 font-weight:900;
 letter-spacing:-1.5px
}

.modal{
 display:none;
 position:fixed;
 inset:0;
 z-index:1000;
 background:rgba(0,0,0,.9);
 backdrop-filter:blur(10px)
}
.active-modal{
 display:flex;
 align-items:center;
 justify-content:center
}

.portal-card{
 background:#fff;
 border-radius:40px;
 padding:30px;
 width:95%;
 max-width:400px;
 max-height:90vh;
 overflow:auto
}
.step-hidden{display:none}

input{
 border:2px solid #f0f0f0;
 border-radius:18px;
 padding:16px;
 font-size:11px;
 font-weight:600
}
input:focus{
 border-color:#000;
 outline:none
}

/* TOAST */
#toast-container{
 position:fixed;
 top:24px;
 right:24px;
 z-index:9999;
 display:flex;
 flex-direction:column;
 gap:12px
}
.toast{
 min-width:260px;
 padding:16px 20px;
 border-radius:18px;
 font-weight:900;
 font-size:11px;
 text-transform:uppercase;
 letter-spacing:1px;
 animation:toastIn .4s ease,toastOut .4s ease 3.6s forwards;
 box-shadow:0 20px 40px rgba(0,0,0,.2)
}
.toast-success{background:#000;color:#fff}
.toast-info{background:#f3f4f6;color:#000}

@keyframes toastIn{
 from{transform:translateX(120%);opacity:0}
 to{transform:translateX(0);opacity:1}
}
@keyframes toastOut{
 to{opacity:0;transform:translateX(120%)}
}
</style>
</head>

<body>

<div id="toast-container"></div>

<header class="p-6 flex justify-between sticky top-0 bg-white z-50">
 <h1 class="brand-logo">SMILE MC 👑</h1>
 <div id="user-display" class="text-[10px] font-black uppercase opacity-30">Guest</div>
</header>

<main class="p-6 max-w-7xl mx-auto">

<input id="searchInput" oninput="searchProducts()"
 class="w-full p-5 mb-8 bg-gray-50 text-[11px] uppercase font-black tracking-[3px] rounded-[28px]"
 placeholder="SEARCH RANK">

<div id="product-grid" class="grid grid-cols-2 md:grid-cols-4 gap-6"></div>

</main>

<!-- NAV -->
<nav class="fixed bottom-8 left-1/2 -translate-x-1/2 w-[90%] max-w-md bg-black text-white rounded-[35px] p-6 flex justify-around z-50">
 <div onclick="showToast('Store Loaded','info')">🏠</div>
 <div onclick="openModal('authModal')">👤</div>
 <div onclick="promptAdmin()">🛡️</div>
</nav>

<!-- AUTH -->
<div id="authModal" class="modal">
<div class="portal-card">
 <h2 class="text-2xl font-black uppercase mb-6">Sign In</h2>
 <input id="auth-email" placeholder="EMAIL" class="w-full mb-3">
 <input id="auth-pass" placeholder="PASSWORD" type="password" class="w-full">
 <button onclick="handleAuth()" class="w-full bg-black text-white py-5 rounded-2xl font-black uppercase mt-5">
  Continue
 </button>
</div>
</div>

<!-- CHECKOUT -->
<div id="checkoutModal" class="modal">
<div class="portal-card">

<!-- STEP 1 -->
<div id="step-1">
 <h2 class="text-xl font-black uppercase mb-6">Order Details</h2>
 <input id="c-name" placeholder="FULL NAME" class="w-full mb-3">
 <input id="c-wa" placeholder="WHATSAPP NUMBER" class="w-full mb-3">
 <input id="c-email" placeholder="GMAIL ADDRESS" class="w-full mb-3">
 <input id="c-discord" placeholder="DISCORD ID" class="w-full mb-3">
 <input id="c-ign" placeholder="MINECRAFT IGN" class="w-full mb-6">
 <button onclick="nextStep(2)" class="w-full bg-black text-white py-5 rounded-2xl font-black uppercase">
  Next
 </button>
</div>

<!-- STEP 2 -->
<div id="step-2" class="step-hidden">
 <h2 class="text-xl font-black uppercase mb-6">Payment</h2>

 <div class="bg-black text-white p-6 rounded-3xl mb-6 text-center">
  <p class="text-[10px] uppercase opacity-60">My Account</p>
  <p class="text-xl font-black">03106723295</p>
  <p class="text-[11px] mt-2">Easypaisa</p>
  <p class="font-bold">Tehmina Ahtisham</p>
 </div>

 <button onclick="nextStep(3)" class="w-full bg-black text-white py-5 rounded-2xl font-black uppercase">
  I Have Paid
 </button>
</div>

<!-- STEP 3 -->
<div id="step-3" class="step-hidden text-center">
 <div class="text-5xl mb-4">✅</div>
 <h2 class="text-xl font-black uppercase mb-4">Payment Submitted</h2>
 <p class="text-[11px] font-bold opacity-50 mb-6">
  If you have paid, please contact admin
 </p>

 <a href="https://wa.me/923706116030" target="_blank"
  class="block w-full bg-[#25D366] text-white py-5 rounded-2xl font-black uppercase mb-3">
  WhatsApp Admin
 </a>

 <div class="bg-gray-100 py-4 rounded-2xl font-black text-[11px] uppercase">
  Discord: frostdragon._.
 </div>
</div>

</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig={
 apiKey:"AIzaSyC41Y6mNNBFvjNeHdOOWGsjczMjyaqoqjU",
 authDomain:"fajar-collection-8aba3.firebaseapp.com",
 projectId:"fajar-collection-8aba3"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const auth=getAuth(app);

let products=[],selectedProduct="";

/* TOAST */
window.showToast=(m,t="success")=>{
 const d=document.createElement("div");
 d.className=`toast toast-${t}`;
 d.innerText=m;
 document.getElementById("toast-container").appendChild(d);
 setTimeout(()=>d.remove(),4200);
};

/* AUTH */
window.handleAuth=async()=>{
 try{
  await signInWithEmailAndPassword(auth,auth-email.value,auth-pass.value);
  closeModal('authModal');
  showToast("Logged In");
 }catch{
  await createUserWithEmailAndPassword(auth,auth-email.value,auth-pass.value);
  closeModal('authModal');
  showToast("Account Created");
 }
};
onAuthStateChanged(auth,u=>{
 user-display.innerText=u?"Connected":"Guest";
});

/* PRODUCTS */
onSnapshot(query(collection(db,"products"),orderBy("createdAt","desc")),snap=>{
 products=snap.docs.map(d=>d.data());
 renderProducts(products);
});

function renderProducts(list){
 product-grid.innerHTML=list.map(p=>`
 <div class="bg-white rounded-[35px] border overflow-hidden">
  <img src="${p.image}" class="aspect-square w-full object-cover">
  <div class="p-5">
   <p class="text-[10px] font-black uppercase opacity-20">${p.name}</p>
   <p class="text-xl font-black mb-4">Rs.${p.price}</p>
   <button onclick="startCheckout('${p.name}')" class="w-full bg-black text-white py-4 rounded-2xl text-[9px] font-black uppercase">
    Buy Now
   </button>
  </div>
 </div>`).join("");
}

/* SEARCH */
window.searchProducts=()=>{
 const q=searchInput.value.toLowerCase();
 renderProducts(products.filter(p=>p.name.toLowerCase().includes(q)));
};

/* CHECKOUT */
window.startCheckout=name=>{
 selectedProduct=name;
 openModal('checkoutModal');
 nextStep(1);
};

window.nextStep=s=>{
 ['step-1','step-2','step-3'].forEach(id=>{
  document.getElementById(id).classList.add('step-hidden');
 });
 document.getElementById('step-'+s).classList.remove('step-hidden');
 if(s===3){
  addDoc(collection(db,"orders"),{
   product:selectedProduct,
   name:c-name.value,
   whatsapp:c-wa.value,
   email:c-email.value,
   discord:c-discord.value,
   ign:c-ign.value,
   createdAt:serverTimestamp()
  });
  showToast("Order Sent to Admin 👑");
 }
};

/* UI */
window.openModal=id=>document.getElementById(id).classList.add("active-modal");
window.closeModal=id=>document.getElementById(id).classList.remove("active-modal");
window.promptAdmin=()=>showToast("Admin Locked 🔐","info");
</script>

</body>
</html>
