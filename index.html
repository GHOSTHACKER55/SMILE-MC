<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMILE MC | PREMIUM STORE 👑</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fafafa; color: #000000; margin: 0; padding-bottom: 120px; }
        
        .brand-logo { font-size: 1.6rem; font-weight: 900; text-transform: uppercase; letter-spacing: -1.5px; }
        .modal { display: none; position: fixed; z-index: 1000; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(15px); }
        .active-modal { display: flex; align-items: center; justify-content: center; animation: fadeIn 0.3s ease; }
        .portal-card { background: white; border-radius: 40px; padding: 40px; width: 95%; max-width: 440px; box-shadow: 0 30px 60px rgba(0,0,0,0.3); position: relative; max-height: 85vh; overflow-y: auto; }
        
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

        /* BIG BEAUTIFUL PREMIUM INPUTS */
        .premium-input {
            border: 3px solid #f2f2f2;
            outline: none;
            border-radius: 24px;
            font-weight: 800;
            background: #fdfdfd;
            width: 100%;
            padding: 22px;
            font-size: 13px;
            margin-bottom: 12px;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }
        .premium-input:focus { border-color: #000; background: #fff; transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0,0,0,0.05); }

        /* ADMIN TAB BUTTONS */
        .admin-tab-btn { padding: 12px 20px; border-radius: 18px; font-weight: 900; font-size: 10px; text-transform: uppercase; transition: 0.3s; background: #f5f5f5; color: #aaa; }
        .admin-tab-btn.active { background: #000; color: #fff; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }

        .btn-auth { background: #000; color: white; padding: 18px; border-radius: 22px; font-weight: 900; width: 100%; text-transform: uppercase; letter-spacing: 1px; margin-top: 10px; }
        
        .nav-pill { background: white; border: 1px solid #eee; box-shadow: 0 15px 35px rgba(0,0,0,0.1); border-radius: 40px; }
        .hidden { display: none !important; }

        /* ORDER & USER CARDS */
        .data-card { background: #fff; border: 1px solid #eee; padding: 20px; border-radius: 28px; transition: 0.3s; }
        .data-card:hover { border-color: #000; transform: translateY(-3px); }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <div id="staffModal" class="modal">
        <div class="portal-card text-center">
            <h2 class="text-2xl font-black uppercase italic mb-8 tracking-tighter">STAFF ACCESS</h2>
            <div class="border-2 border-blue-500 rounded-[24px] p-4 mb-6 shadow-lg shadow-blue-100">
                <input type="password" id="staff-key-input" placeholder="••••••••" class="text-center text-3xl font-black tracking-[15px] outline-none w-full">
            </div>
            <button onclick="verifyStaff()" class="btn-auth !bg-black !text-white !py-6 mb-4">UNLOCK ADMIN</button>
            <button onclick="closeModal('staffModal')" class="text-[10px] font-black opacity-30 uppercase">Cancel</button>
        </div>
    </div>

    <div id="authModal" class="modal">
        <div class="portal-card">
            <h2 id="auth-title" class="text-2xl font-black uppercase mb-8 tracking-tighter">Create Account</h2>
            <div id="signup-fields" class="space-y-1">
                <input type="text" id="reg-name" placeholder="Full Name" class="premium-input">
                <input type="text" id="reg-phone" placeholder="WhatsApp Number" class="premium-input">
            </div>
            <input type="email" id="auth-email" placeholder="Gmail Address" class="premium-input">
            <input type="password" id="auth-pass" placeholder="Password" class="premium-input">
            <button onclick="handleAuth()" id="auth-submit-btn" class="btn-auth shadow-xl">Register Now</button>
            <p onclick="toggleAuthMode()" class="text-[10px] font-bold text-center mt-6 cursor-pointer opacity-40 uppercase">Switch to Login/Register</p>
        </div>
    </div>

    <header class="p-8 flex items-center justify-between sticky top-0 bg-white/80 backdrop-blur-lg z-50">
        <h1 class="brand-logo">SMILE MC 👑</h1>
        <div id="user-display" onclick="openAccount()" class="bg-black text-white px-6 py-2 rounded-full text-[10px] font-black uppercase cursor-pointer">Login</div>
    </header>

    <main class="p-6 max-w-7xl mx-auto">
        <section id="page-home">
            <div id="product-grid" class="grid grid-cols-2 md:grid-cols-4 gap-6"></div>
        </section>

        <section id="page-admin" class="hidden">
            <div class="bg-black text-white p-8 rounded-[40px] mb-8 flex justify-between items-center">
                <div>
                    <p class="text-[10px] font-black opacity-40 uppercase">Total Store Visitors</p>
                    <h2 id="stat-visitors" class="text-4xl font-black">0</h2>
                </div>
                <button onclick="showPage('home')" class="bg-white/10 px-6 py-3 rounded-2xl text-[10px] font-black uppercase">Close Admin</button>
            </div>

            <div class="flex gap-2 mb-8 overflow-x-auto no-scrollbar">
                <button onclick="switchTab('orders')" id="btn-orders" class="admin-tab-btn active">Live Orders</button>
                <button onclick="switchTab('users')" id="btn-users" class="admin-tab-btn">Accounts</button>
                <button onclick="switchTab('products')" id="btn-products" class="admin-tab-btn">Manage Products</button>
            </div>

            <div id="tab-orders" class="admin-section space-y-4"></div>

            <div id="tab-users" class="admin-section hidden grid gap-4"></div>

            <div id="tab-products" class="admin-section hidden">
                <div class="bg-white p-8 rounded-[35px] border-2 border-black mb-8">
                    <h4 class="font-black text-[11px] uppercase mb-4">Add / Edit Item</h4>
                    <input type="text" id="p-name" placeholder="Name" class="premium-input">
                    <input type="number" id="p-price" placeholder="Price" class="premium-input">
                    <input type="file" id="p-file" class="mb-4 text-[10px]">
                    <button id="p-save-btn" onclick="handlePublish()" class="btn-auth">Publish to Store</button>
                </div>
                <div id="admin-product-list" class="space-y-3"></div>
            </div>
        </section>
    </main>

    <nav class="fixed bottom-10 left-1/2 -translate-x-1/2 w-[85%] max-w-md p-6 flex justify-around items-center z-50 nav-pill">
        <div onclick="showPage('home')" class="text-2xl cursor-pointer">🏠</div>
        <div onclick="openModal('staffModal')" class="text-2xl cursor-pointer">🛡️</div>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, setDoc, getDoc, updateDoc, deleteDoc, serverTimestamp, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC41Y6mNNBFvjNeHdOOWGsjczMjyaqoqjU",
            authDomain: "fajar-collection-8aba3.firebaseapp.com",
            projectId: "fajar-collection-8aba3",
            storageBucket: "fajar-collection-8aba3.firebasestorage.app",
            messagingSenderId: "620336064195",
            appId: "1:620336064195:web:4608ae5f133de8fa17a476"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // VISITOR TRACKING
        async function trackVisitor() {
            await setDoc(doc(db, "stats", "visitors"), { count: increment(1) }, { merge: true });
        }
        trackVisitor();

        // AUTH LOGIC
        let isSignUp = true;
        window.toggleAuthMode = () => {
            isSignUp = !isSignUp;
            document.getElementById('auth-title').innerText = isSignUp ? "Create Account" : "Sign In";
            document.getElementById('auth-submit-btn').innerText = isSignUp ? "Register Now" : "Sign In";
            document.getElementById('signup-fields').classList.toggle('hidden', !isSignUp);
        };

        window.handleAuth = async () => {
            const email = document.getElementById('auth-email').value;
            const pass = document.getElementById('auth-pass').value;
            try {
                if(isSignUp) {
                    const res = await createUserWithEmailAndPassword(auth, email, pass);
                    await setDoc(doc(db, "users", res.user.uid), {
                        name: document.getElementById('reg-name').value,
                        phone: document.getElementById('reg-phone').value,
                        email: email,
                        createdAt: serverTimestamp()
                    });
                } else {
                    await signInWithEmailAndPassword(auth, email, pass);
                }
                closeModal('authModal');
            } catch (e) { alert(e.message); }
        };

        // ADMIN CONTENT LOADING
        function loadAdminData() {
            // Visitors
            onSnapshot(doc(db, "stats", "visitors"), d => { document.getElementById('stat-visitors').innerText = d.data()?.count || 0; });

            // Orders
            onSnapshot(query(collection(db, "orders"), orderBy("timestamp", "desc")), snap => {
                document.getElementById('tab-orders').innerHTML = snap.docs.map(d => `
                    <div class="data-card border-l-8 border-l-green-500">
                        <div class="flex justify-between mb-2">
                            <span class="font-black text-[10px] uppercase">${d.data().product}</span>
                            <span class="text-[9px] opacity-40">${new Date(d.data().timestamp?.toDate()).toLocaleString()}</span>
                        </div>
                        <h4 class="font-black text-lg">${d.data().ign}</h4>
                        <div class="grid grid-cols-2 gap-2 mt-3">
                            <p class="text-[9px] font-bold uppercase">Discord: ${d.data().discord}</p>
                            <p class="text-[9px] font-bold uppercase">WA: ${d.data().wa}</p>
                        </div>
                        <button onclick="deleteDoc(doc(db, 'orders', '${d.id}'))" class="mt-4 text-[9px] text-red-500 font-black">MARK AS COMPLETED</button>
                    </div>
                `).join('');
            });

            // Users
            onSnapshot(collection(db, "users"), snap => {
                document.getElementById('tab-users').innerHTML = snap.docs.map(d => `
                    <div class="data-card flex items-center gap-4">
                        <div class="w-12 h-12 bg-black rounded-2xl flex items-center justify-center text-white font-black">${d.data().name[0]}</div>
                        <div>
                            <h4 class="font-black text-[12px] uppercase">${d.data().name}</h4>
                            <p class="text-[10px] opacity-40">${d.data().email}</p>
                            <p class="text-[10px] text-blue-600 font-black">${d.data().phone}</p>
                        </div>
                    </div>
                `).join('');
            });
        }

        // NAVIGATION & UI
        window.switchTab = (tab) => {
            document.querySelectorAll('.admin-section').forEach(s => s.classList.add('hidden'));
            document.querySelectorAll('.admin-tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.remove('hidden');
            document.getElementById(`btn-${tab}`).classList.add('active');
        };

        window.verifyStaff = () => {
            if(document.getElementById('staff-key-input').value === "GHOSTYDEVELOPER") {
                closeModal('staffModal');
                showPage('admin');
                loadAdminData();
            } else { alert("Wrong Key"); }
        };

        // SHARED HELPERS
        window.openModal = id => document.getElementById(id).classList.add('active-modal');
        window.closeModal = id => document.getElementById(id).classList.remove('active-modal');
        window.showPage = id => {
            document.getElementById('page-home').classList.toggle('hidden', id !== 'home');
            document.getElementById('page-admin').classList.toggle('hidden', id !== 'admin');
        };
        window.openAccount = () => auth.currentUser ? alert("Logged in as " + auth.currentUser.email) : openModal('authModal');

        // PRODUCTS (Home Display)
        onSnapshot(query(collection(db, "products"), orderBy("createdAt", "desc")), snap => {
            document.getElementById('product-grid').innerHTML = snap.docs.map(d => `
                <div class="bg-white rounded-[40px] border border-gray-100 overflow-hidden shadow-sm">
                    <img src="${d.data().image}" class="w-full aspect-square object-cover">
                    <div class="p-6">
                        <p class="text-xl font-black mb-4">Rs.${d.data().price}</p>
                        <button class="w-full py-4 bg-black text-white rounded-2xl text-[10px] font-black uppercase tracking-widest">Buy Now</button>
                    </div>
                </div>`).join('');
        });
    </script>
</body>
</html>
