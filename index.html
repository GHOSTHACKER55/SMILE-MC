<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="client-page">
        <header>
            <h1>Our Products</h1>
            <button onclick="showLogin()" class="admin-btn">Admin Login</button>
        </header>
        
        <div id="product-grid" class="grid">
            </div>
    </div>

    <div id="admin-page" style="display: none;">
        <header>
            <h1>Admin Dashboard</h1>
            <button onclick="logout()" class="admin-btn">Logout</button>
        </header>

        <div class="form-container">
            <h3>Add New Product</h3>
            <input type="text" id="p-title" placeholder="Product Title">
            <input type="text" id="p-img" placeholder="Image URL (e.g. https://picsum.photos/200)">
            <textarea id="p-desc" placeholder="Product Description"></textarea>
            <button onclick="addProduct()">List Product</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
