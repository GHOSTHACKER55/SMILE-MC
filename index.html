<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMILE MC | PREMIUM STORE 👑</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800;900&display=swap');

body{
    font-family:'Plus Jakarta Sans',sans-serif;
    background:#fff;
    padding-bottom:120px
}

/* BRAND */
.brand-logo{
    font-size:1.6rem;
    font-weight:900;
    letter-spacing:-1.5px
}

/* INPUTS */
input{
    border:2px solid #eee;
    border-radius:18px;
    padding:16px;
    font-size:11px;
    font-weight:700;
    transition:.3s
}
input:focus{
    border-color:#000;
    background:#fff
}

/* MODAL */
.modal{
    display:none;
    position:fixed;
    inset:0;
    z-index:1000;
    background:rgba(0,0,0,.85);
    backdrop-filter:blur(8px)
}
.active-modal{
    display:flex;
    align-items:center;
    justify-content:center
}
.portal-card{
    background:#fff;
    width:95%;
    max-width:420px;
    max-height:90vh;
    overflow:auto;
    padding:30px;
    border-radius:40px
}

/* TOAST */
#toast-container{
    position:fixed;
    top:24px;
    right:24px;
    z-index:9999;
    display:flex;
    flex-direction:column;
    gap:12px
}
.toast{
    min-width:260px;
    padding:16px 20px;
    border-radius:18px;
    font-weight:900;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1px;
    animation:slideIn .4s ease,fadeOut .4s ease 3.5s forwards;
    box-shadow:0 20px 40px rgba(0,0,0,.2)
}
.toast-success{background:#000;color:#fff}
.toast-error{background:#fee2e2;color:#991b1b}
.toast-info{background:#f3f4f6;color:#000}

@keyframes slideIn{
    from{transform:translateX(120%);opacity:0}
    to{transform:translateX(0);opacity:1}
}
@keyframes fadeOut{
    to{opacity:0;transform:translateX(120%)}
}
</style>
</head>

<body>

<!-- TOAST -->
<div id="toast-container"></div>

<!-- HEADER -->
<header class="p-6 flex justify-between sticky top-0 bg-white z-50">
    <h1 class="brand-logo">SMILE MC 👑</h1>
    <div id="user-display" class="text-[10px] font-black opacity-30 uppercase">Guest</div>
</header>

<!-- SEARCH -->
<div class="px-6 mb-6">
    <input id="searchInput" oninput="searchProducts()" placeholder="SEARCH RANK / PRODUCT"
           class="w-full bg-gray-50 uppercase tracking-widest">
</div>

<!-- STORE -->
<main class="px-6 max-w-7xl mx-auto">
    <div id="product-grid" class="grid grid-cols-2 md:grid-cols-4 gap-6"></div>
</main>

<!-- BOTTOM NAV -->
<nav class="fixed bottom-8 left-1/2 -translate-x-1/2 w-[90%] max-w-md bg-black text-white rounded-[35px] p-6 flex justify-around">
    <div onclick="showToast('Store Loaded 🏠','info')" class="text-center cursor-pointer">
        <span class="text-xl">🏠</span>
        <p class="text-[8px] uppercase opacity-50">Store</p>
    </div>
    <div onclick="openModal('authModal')" class="text-center cursor-pointer">
        <span class="text-xl">👤</span>
        <p class="text-[8px] uppercase opacity-50">Account</p>
    </div>
    <div onclick="promptAdmin()" class="text-center cursor-pointer">
        <span class="text-xl">🛡️</span>
        <p class="text-[8px] uppercase opacity-50">Staff</p>
    </div>
</nav>

<!-- AUTH MODAL -->
<div id="authModal" class="modal">
<div class="portal-card">
    <h2 id="auth-title" class="text-2xl font-black mb-6 uppercase">Create Account</h2>
    <input id="auth-email" placeholder="EMAIL ADDRESS" class="w-full mb-3">
    <input id="auth-pass" placeholder="PASSWORD" type="password" class="w-full mb-4">
    <button onclick="handleAuth()" class="w-full bg-black text-white py-5 rounded-2xl font-black text-[11px] uppercase">
        Continue
    </button>
    <button onclick="closeModal('authModal')" class="w-full mt-4 text-[10px] font-black opacity-30 uppercase">
        Cancel
    </button>
</div>
</div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig={
 apiKey:"AIzaSyC41Y6mNNBFvjNeHdOOWGsjczMjyaqoqjU",
 authDomain:"fajar-collection-8aba3.firebaseapp.com",
 projectId:"fajar-collection-8aba3"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const auth=getAuth(app);

let products=[];

/* TOAST */
window.showToast=(msg,type="success")=>{
 const t=document.createElement("div");
 t.className=`toast toast-${type}`;
 t.innerText=msg;
 document.getElementById("toast-container").appendChild(t);
 setTimeout(()=>t.remove(),4200);
};

/* AUTH */
window.handleAuth=async()=>{
 try{
   await signInWithEmailAndPassword(auth,
     document.getElementById("auth-email").value,
     document.getElementById("auth-pass").value
   );
   closeModal('authModal');
   showToast("Logged In Successfully 👑");
 }catch{
   await createUserWithEmailAndPassword(auth,
     document.getElementById("auth-email").value,
     document.getElementById("auth-pass").value
   );
   closeModal('authModal');
   showToast("Account Created 🚀");
 }
};

onAuthStateChanged(auth,u=>{
 document.getElementById("user-display").innerText=u?"Connected":"Guest";
});

/* PRODUCTS */
onSnapshot(query(collection(db,"products"),orderBy("createdAt","desc")),snap=>{
 products=snap.docs.map(d=>d.data());
 renderProducts(products);
});

function renderProducts(list){
 document.getElementById("product-grid").innerHTML=list.map(p=>`
 <div class="bg-white border rounded-[30px] overflow-hidden">
   <img src="${p.image}" class="aspect-square w-full object-cover">
   <div class="p-5">
     <p class="text-[10px] font-black uppercase opacity-30">${p.name}</p>
     <p class="text-xl font-black mb-4">Rs.${p.price}</p>
     <button onclick="showToast('Order Started 🧾')" class="w-full bg-black text-white py-4 rounded-2xl text-[9px] font-black uppercase">
       Buy Now
     </button>
   </div>
 </div>`).join("");
}

/* SEARCH */
window.searchProducts=()=>{
 const q=document.getElementById("searchInput").value.toLowerCase();
 renderProducts(products.filter(p=>p.name.toLowerCase().includes(q)));
};

/* UI */
window.openModal=id=>document.getElementById(id).classList.add("active-modal");
window.closeModal=id=>document.getElementById(id).classList.remove("active-modal");
window.promptAdmin=()=>showToast("Admin Panel Locked 🔐","error");
</script>

</body>
</html>
