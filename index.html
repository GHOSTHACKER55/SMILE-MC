<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMILE MC | Premium 💫</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap');
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #fcfcfc; 
            color: #000; 
            margin: 0; 
            padding-bottom: 120px;
            font-weight: 800; /* Makes everything on the web bold */
        }
        
        /* THE BEAUTIFUL MIDDLE TOP TITLE */
        .main-header {
            text-align: center;
            padding: 40px 20px;
            background: #fff;
            border-bottom: 2px solid #f0f0f0;
        }
        .brand-logo-center {
            font-size: 3rem;
            font-weight: 900;
            font-style: italic;
            letter-spacing: -2px;
            background: linear-gradient(90deg, #00c6ff, #0072ff, #00ffaa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: block;
            margin-bottom: 5px;
        }
        .brand-sub {
            font-size: 10px;
            letter-spacing: 5px;
            text-transform: uppercase;
            opacity: 0.5;
            display: block;
        }

        /* BIGGER BOLD CARDS */
        .product-card {
            background: white;
            border-radius: 35px;
            border: 3px solid #000; /* Thick bold border */
            overflow: hidden;
            transition: transform 0.3s ease;
        }
        .product-card:hover {
            transform: scale(1.02);
        }

        /* CARD TEXT STYLE */
        .product-title {
            font-weight: 900;
            text-align: center;
            text-transform: uppercase;
            font-size: 1.1rem; /* Bigger title */
            margin-top: 15px;
            padding: 0 10px;
        }
        .product-price {
            font-weight: 900;
            text-align: center;
            font-size: 1.2rem;
            color: #000;
            margin-top: 8px;
        }

        /* PORTAL MODALS */
        .modal { display: none; position: fixed; z-index: 1000; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(20px); }
        .active-modal { display: flex; align-items: center; justify-content: center; }
        .portal-card {
            background: white; border-radius: 50px; padding: 50px; 
            width: 90%; max-width: 400px; text-align: center;
            border: 4px solid #000;
        }

        /* BUY NOW BUTTON */
        .buy-now-btn {
            background: #000;
            color: #fff;
            border: none;
            padding: 18px;
            border-radius: 20px;
            font-weight: 900;
            text-transform: uppercase;
            font-size: 14px;
            margin-top: 20px;
            width: 100%;
            display: block;
            transition: 0.2s;
        }
        .buy-now-btn:hover { background: #333; }
    </style>
</head>
<body>

    <div id="deleteConfirmModal" class="modal">
        <div class="portal-card">
            <h2 class="text-3xl font-black italic mb-4">DELETE?</h2>
            <p class="mb-8 opacity-60">GHOSTY SYSTEM: THIS ACTION IS PERMANENT.</p>
            <input type="hidden" id="delete-target-id">
            <button onclick="executeDelete()" class="w-full bg-red-600 text-white py-5 rounded-2xl font-black mb-3">CONFIRM DELETE</button>
            <button onclick="closeModal('deleteConfirmModal')" class="w-full bg-gray-200 py-4 rounded-2xl font-black">CANCEL</button>
        </div>
    </div>

    <div id="adminAuthModal" class="modal">
        <div class="portal-card">
            <h2 class="text-2xl font-black mb-2 italic">STAFF ACCESS</h2>
            <p class="text-[9px] font-bold opacity-40 mb-8 tracking-widest uppercase">Ghosty Developer Secure</p>
            <input type="password" id="admin-pass-input" placeholder="PASSWORD" class="w-full p-5 rounded-2xl mb-6 text-center font-black bg-gray-100 border-2 border-black outline-none">
            <button onclick="verifyAdmin()" class="w-full bg-blue-600 text-white py-5 rounded-2xl font-black">UNLOCK</button>
        </div>
    </div>

    <header class="main-header">
        <span class="brand-logo-center">SMILE MC</span>
        <span class="brand-sub">Premium Collection</span>
    </header>

    <main class="px-6 mt-10 max-w-7xl mx-auto">
        <section id="page-home">
            <div id="product-grid" class="grid grid-cols-1 md:grid-cols-3 gap-10"></div>
        </section>

        <section id="page-admin" class="hidden">
            <div class="grid lg:grid-cols-3 gap-8">
                <div class="bg-white p-8 rounded-[40px] border-4 border-black">
                    <h3 class="font-black text-xl mb-6 italic uppercase">Add Product</h3>
                    <div class="space-y-4">
                        <input type="hidden" id="edit-product-id">
                        <input type="text" id="p-name" placeholder="NAME" class="w-full p-4 border-2 border-black rounded-xl font-black">
                        <input type="number" id="p-price" placeholder="PRICE" class="w-full p-4 border-2 border-black rounded-xl font-black">
                        <textarea id="p-desc" placeholder="DESC" class="w-full p-4 border-2 border-black rounded-xl font-black h-24"></textarea>
                        <input type="file" id="p-file" class="font-black">
                        <button onclick="handlePublish()" class="w-full bg-black text-white py-5 rounded-xl font-black uppercase">Post To Store</button>
                    </div>
                </div>
                <div class="lg:col-span-2 space-y-4">
                    <h3 class="font-black opacity-30 uppercase italic">Active Inventory</h3>
                    <div id="admin-inventory-list" class="space-y-4"></div>
                </div>
            </div>
        </section>
    </main>

    <nav class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-black text-white p-4 rounded-full flex gap-10 px-12 shadow-2xl z-50">
        <div onclick="showPage('home')" class="cursor-pointer font-black italic">HOME</div>
        <div onclick="openModal('adminAuthModal')" class="cursor-pointer font-black italic">STAFF</div>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, updateDoc, serverTimestamp, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC41Y6mNNBFvjNeHdOOWGsjczMjyaqoqjU",
            authDomain: "fajar-collection-8aba3.firebaseapp.com",
            projectId: "fajar-collection-8aba3",
            storageBucket: "fajar-collection-8aba3.firebasestorage.app",
            messagingSenderId: "620336064195",
            appId: "1:620336064195:web:4608ae5f133de8fa17a476"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const DISCORD = "https://discord.gg/r6t7JjAwTA";
        let allItems = [];

        window.verifyAdmin = () => {
            if (document.getElementById('admin-pass-input').value === "GHOSTYDEVELOPER") {
                closeModal('adminAuthModal');
                showPage('admin');
            } else alert("INVALID");
        };

        window.askDelete = (id) => {
            document.getElementById('delete-target-id').value = id;
            openModal('deleteConfirmModal');
        };

        window.executeDelete = async () => {
            const id = document.getElementById('delete-target-id').value;
            if(id) {
                await deleteDoc(doc(db, 'products', id));
                closeModal('deleteConfirmModal');
            }
        };

        onSnapshot(query(collection(db, "products"), orderBy("createdAt", "desc")), snap => {
            allItems = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            render();
        });

        function render() {
            // Home Grid
            document.getElementById('product-grid').innerHTML = allItems.map(p => `
                <div class="product-card">
                    <img src="${p.image}" class="w-full aspect-square object-cover border-b-4 border-black">
                    <div class="p-6">
                        <h4 class="product-title">${p.name}</h4>
                        <p class="product-price">Rs.${p.price} PKR</p>
                        <a href="${DISCORD}" target="_blank" class="buy-now-btn text-center">Buy Now !</a>
                    </div>
                </div>
            `).join('');

            // Inventory List
            document.getElementById('admin-inventory-list').innerHTML = allItems.map(p => `
                <div class="flex items-center gap-4 bg-white p-4 rounded-3xl border-2 border-black">
                    <img src="${p.image}" class="w-16 h-16 rounded-xl object-cover border-2 border-black">
                    <div class="flex-1 font-black uppercase text-sm">${p.name}</div>
                    <button onclick="askDelete('${p.id}')" class="text-red-600 font-black">DEL</button>
                </div>
            `).join('');
        }

        window.handlePublish = async () => {
            const name = document.getElementById('p-name').value, price = document.getElementById('p-price').value, 
                  file = document.getElementById('p-file').files[0];

            if(!name || !price || !file) return alert("Fill all details");
            
            const fd = new FormData(); fd.append("image", file);
            const r = await fetch("https://api.imgbb.com/1/upload?key=a107d2f7b3059bbb23a1b6e9f61153c7", { method: "POST", body: fd });
            const d = await r.json();

            await addDoc(collection(db, "products"), { 
                name, price, image: d.data.url, createdAt: serverTimestamp() 
            });
            alert("SUCCESS");
        };

        window.showPage = id => {
            document.getElementById('page-home').classList.add('hidden');
            document.getElementById('page-admin').classList.add('hidden');
            document.getElementById(`page-${id}`).classList.remove('hidden');
        };

        window.openModal = (id) => document.getElementById(id).classList.add('active-modal');
        window.closeModal = (id) => document.getElementById(id).classList.remove('active-modal');

        showPage('home');
    </script>
</body>
</html>
