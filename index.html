<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMILE MC | Premium 💫</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800;900&display=swap');
        
        /* FULLY BOLD WEB */
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #fcfcfc; 
            color: #000; 
            margin: 0; 
            padding-bottom: 120px;
            font-weight: 900; 
        }
        
        /* BEAUTIFUL MIDDLE TOP TITLE */
        .header-container {
            text-align: center;
            padding: 50px 20px;
            background: #ffffff;
        }
        .brand-logo-main {
            font-size: 3.5rem;
            font-weight: 900;
            font-style: italic;
            display: block;
            line-height: 1;
            background: linear-gradient(45deg, #00c6ff, #0072ff, #00ffaa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -3px;
        }
        .brand-sub-text {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 6px;
            opacity: 0.4;
            margin-top: 10px;
            display: block;
        }

        /* BIGGER BOLD CARDS */
        .product-card {
            background: white;
            border-radius: 40px;
            border: 3px solid #000;
            overflow: hidden;
            transition: 0.3s;
        }
        
        .product-title {
            font-weight: 900;
            text-align: center;
            text-transform: uppercase;
            font-size: 1.2rem;
            letter-spacing: -0.03em;
            margin-top: 10px;
        }

        .product-price {
            font-weight: 900;
            text-align: center;
            font-size: 1.3rem;
            color: #000;
            margin-top: 5px;
        }

        /* GHOSTY PORTAL STYLE */
        .modal { display: none; position: fixed; z-index: 1000; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(20px); }
        .active-modal { display: flex; align-items: center; justify-content: center; }
        
        .portal-card {
            background: white; border-radius: 50px; padding: 45px; 
            width: 90%; max-width: 400px; text-align: center;
            border: 4px solid #000;
        }

        /* BOLD BUY NOW BUTTON */
        .buy-now-btn {
            background: #000;
            color: #fff;
            padding: 18px;
            border-radius: 22px;
            font-weight: 900;
            text-transform: uppercase;
            font-size: 14px;
            margin-top: 20px;
            width: 100%;
            display: block;
            border: none;
            transition: 0.2s;
        }
        .buy-now-btn:hover { background: #333; transform: scale(1.03); }

        .nav-btn { font-weight: 900; text-transform: uppercase; font-style: italic; font-size: 14px; }
    </style>
</head>
<body>

    <div id="deleteConfirmModal" class="modal">
        <div class="portal-card">
            <h2 class="text-3xl font-black italic mb-2 uppercase">Delete?</h2>
            <p class="text-[10px] font-bold opacity-40 uppercase mb-10 tracking-widest">Ghosty System: Permanent Action</p>
            <input type="hidden" id="delete-target-id">
            <button onclick="executeDelete()" class="w-full bg-red-600 text-white py-5 rounded-2xl font-black uppercase mb-3">Confirm Delete</button>
            <button onclick="closeModal('deleteConfirmModal')" class="w-full bg-gray-100 text-black py-4 rounded-2xl font-black uppercase">Cancel</button>
        </div>
    </div>

    <div id="adminAuthModal" class="modal">
        <div class="portal-card">
            <h2 class="text-2xl font-black italic mb-2 uppercase">Staff Access</h2>
            <p class="text-[9px] font-bold opacity-40 uppercase mb-8 tracking-widest">Ghosty Developer Secure</p>
            <input type="password" id="admin-pass-input" placeholder="ENTER PASSWORD" class="w-full p-6 rounded-3xl mb-6 text-center font-black bg-gray-50 border-4 border-black outline-none text-lg">
            <button onclick="verifyAdmin()" class="w-full bg-blue-600 text-white py-5 rounded-2xl font-black uppercase text-sm tracking-widest">Unlock</button>
            <button onclick="closeModal('adminAuthModal')" class="mt-6 text-[10px] font-black uppercase opacity-30">Close</button>
        </div>
    </div>

    <header class="header-container">
        <span class="brand-logo-main">SMILE MC</span>
        <span class="brand-sub-text">Ghosty Premium Collection</span>
    </header>

    <main class="px-6 max-w-7xl mx-auto mt-6">
        <section id="page-home">
            <div id="product-grid" class="grid grid-cols-1 md:grid-cols-3 gap-10"></div>
        </section>

        <section id="page-admin" class="hidden">
            <div class="grid lg:grid-cols-3 gap-10">
                <div class="bg-white p-8 rounded-[50px] border-4 border-black">
                    <h3 class="font-black text-xl mb-6 italic uppercase underline underline-offset-8">Add Product</h3>
                    <div class="space-y-4">
                        <input type="hidden" id="edit-product-id">
                        <input type="text" id="p-name" placeholder="PRODUCT NAME" class="w-full p-5 border-2 border-black rounded-2xl font-black uppercase text-xs">
                        <input type="number" id="p-price" placeholder="PRICE (RS)" class="w-full p-5 border-2 border-black rounded-2xl font-black text-xs">
                        <textarea id="p-desc" placeholder="DESCRIPTION" class="w-full p-5 border-2 border-black rounded-2xl font-black text-xs h-28"></textarea>
                        <input type="file" id="p-file" class="font-black text-[10px]">
                        <button onclick="handlePublish()" class="w-full bg-black text-white py-6 rounded-2xl font-black uppercase text-sm tracking-tighter">Post Product</button>
                    </div>
                </div>
                <div class="lg:col-span-2">
                    <h3 class="font-black opacity-30 uppercase italic mb-4">Store Inventory</h3>
                    <div id="admin-inventory-list" class="space-y-4"></div>
                </div>
            </div>
        </section>
    </main>

    <nav class="fixed bottom-8 left-1/2 -translate-x-1/2 bg-black text-white px-12 py-5 rounded-full flex gap-12 shadow-2xl z-50">
        <div onclick="showPage('home')" class="nav-btn cursor-pointer">HOME</div>
        <div onclick="openModal('adminAuthModal')" class="nav-btn cursor-pointer">STAFF</div>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, updateDoc, serverTimestamp, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC41Y6mNNBFvjNeHdOOWGsjczMjyaqoqjU",
            authDomain: "fajar-collection-8aba3.firebaseapp.com",
            projectId: "fajar-collection-8aba3",
            storageBucket: "fajar-collection-8aba3.firebasestorage.app",
            messagingSenderId: "620336064195",
            appId: "1:620336064195:web:4608ae5f133de8fa17a476"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const DISCORD_LINK = "https://discord.gg/r6t7JjAwTA";
        let allItems = [];

        window.verifyAdmin = () => {
            if (document.getElementById('admin-pass-input').value === "GHOSTYDEVELOPER") {
                closeModal('adminAuthModal');
                showPage('admin');
            } else alert("DENIED");
        };

        window.askDelete = (id) => {
            document.getElementById('delete-target-id').value = id;
            openModal('deleteConfirmModal');
        };

        window.executeDelete = async () => {
            const id = document.getElementById('delete-target-id').value;
            if(id) {
                await deleteDoc(doc(db, 'products', id));
                closeModal('deleteConfirmModal');
            }
        };

        onSnapshot(query(collection(db, "products"), orderBy("createdAt", "desc")), snap => {
            allItems = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            render();
        });

        function render() {
            // Store Grid
            document.getElementById('product-grid').innerHTML = allItems.map(p => `
                <div class="product-card">
                    <img src="${p.image}" class="w-full aspect-square object-cover border-b-4 border-black">
                    <div class="p-8">
                        <h4 class="product-title">${p.name}</h4>
                        <p class="product-price">Rs.${p.price} PKR</p>
                        <a href="${DISCORD_LINK}" target="_blank" class="buy-now-btn text-center">Buy Now !</a>
                    </div>
                </div>
            `).join('');

            // Admin List
            document.getElementById('admin-inventory-list').innerHTML = allItems.map(p => `
                <div class="flex items-center gap-4 bg-white p-4 rounded-3xl border-2 border-black">
                    <img src="${p.image}" class="w-16 h-16 rounded-2xl object-cover border-2 border-black">
                    <div class="flex-1 font-black uppercase text-xs truncate">${p.name}</div>
                    <button onclick="askDelete('${p.id}')" class="text-red-600 font-black italic px-4">DEL</button>
                </div>
            `).join('');
        }

        window.handlePublish = async () => {
            const name = document.getElementById('p-name').value, price = document.getElementById('p-price').value, 
                  file = document.getElementById('p-file').files[0];

            if(!name || !price || !file) return alert("MISSING INFO");
            
            const fd = new FormData(); fd.append("image", file);
            const r = await fetch("https://api.imgbb.com/1/upload?key=a107d2f7b3059bbb23a1b6e9f61153c7", { method: "POST", body: fd });
            const d = await r.json();

            await addDoc(collection(db, "products"), { 
                name, price, image: d.data.url, createdAt: serverTimestamp() 
            });
            alert("POSTED!");
        };

        window.showPage = id => {
            document.getElementById('page-home').classList.add('hidden');
            document.getElementById('page-admin').classList.add('hidden');
            document.getElementById(`page-${id}`).classList.remove('hidden');
        };

        window.openModal = (id) => document.getElementById(id).classList.add('active-modal');
        window.closeModal = (id) => document.getElementById(id).classList.remove('active-modal');

        showPage('home');
    </script>
</body>
</html>
