<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMILE MC | PREMIUM STORE 👑</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fafafa; color: #000000; margin: 0; padding-bottom: 120px; }
        
        .brand-logo { font-size: 1.6rem; font-weight: 900; text-transform: uppercase; letter-spacing: -1.5px; }
        
        /* MODERN MODALS */
        .modal { display: none; position: fixed; z-index: 1000; inset: 0; background: rgba(255,255,255,0.8); backdrop-filter: blur(15px); }
        .active-modal { display: flex; align-items: center; justify-content: center; animation: fadeIn 0.3s ease; }
        .portal-card { background: white; border-radius: 40px; padding: 40px; width: 95%; max-width: 420px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.1); border: 1px solid #eee; position: relative; max-height: 85vh; overflow-y: auto; }
        
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

        /* BEAUTIFUL FULL NOTIFICATIONS */
        #toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; width: 90%; max-width: 450px; }
        .toast { background: #000; color: #fff; padding: 20px; border-radius: 28px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); display: flex; align-items: center; gap: 15px; animation: slideDown 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); border: 1px solid rgba(255,255,255,0.1); }
        .toast-content h4 { font-size: 13px; font-weight: 900; text-transform: uppercase; margin: 0; letter-spacing: 0.5px; }
        .toast-content p { font-size: 11px; font-weight: 600; opacity: 0.6; margin: 2px 0 0 0; }

        @keyframes slideDown { from { opacity: 0; transform: translateY(-40px); } to { opacity: 1; transform: translateY(0); } }

        input { border: 2px solid #f5f5f5; outline: none; transition: all 0.2s; border-radius: 20px; font-weight: 600; background: #f9f9f9; width: 100%; padding: 16px; font-size: 12px; }
        input:focus { border-color: #000; background: #fff; transform: translateY(-2px); }

        .profile-img-preview { width: 100px; height: 100px; border-radius: 35px; object-fit: cover; border: 4px solid #fff; box-shadow: 0 10px 20px rgba(0,0,0,0.1); background: #eee; }
        .user-avatar-small { width: 45px; height: 45px; border-radius: 15px; object-fit: cover; background: #eee; }
        
        .nav-card { box-shadow: 0 -10px 40px rgba(0,0,0,0.05); border-top: 1px solid #eee; }
        .hidden { display: none !important; }
        
        /* CUSTOM SCROLLBAR */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #eee; border-radius: 10px; }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <div id="authModal" class="modal">
        <div class="portal-card">
            <h2 id="auth-title" class="text-2xl font-black uppercase mb-6 tracking-tighter">Create Account</h2>
            <div id="signup-fields" class="space-y-3">
                <input type="text" id="reg-name" placeholder="FULL NAME">
                <input type="text" id="reg-phone" placeholder="WHATSAPP NUMBER">
            </div>
            <div class="space-y-3 mt-3">
                <input type="email" id="auth-email" placeholder="EMAIL ADDRESS">
                <input type="password" id="auth-pass" placeholder="PASSWORD">
                <button onclick="handleAuth()" id="auth-submit-btn" class="w-full bg-black text-white py-5 rounded-2xl font-black text-[11px] uppercase tracking-widest mt-4 hover:bg-gray-800 transition-colors">Register Now</button>
                <p onclick="toggleAuthMode()" id="auth-toggle" class="text-[10px] font-bold text-center cursor-pointer opacity-50 uppercase mt-6">Already have an account? Sign In</p>
                <button onclick="closeModal('authModal')" class="w-full text-[9px] font-black opacity-20 uppercase mt-4">Cancel</button>
            </div>
        </div>
    </div>

    <div id="staffModal" class="modal">
        <div class="portal-card text-center">
            <div class="mb-6">
                <span class="text-4xl">🔐</span>
                <h2 class="text-2xl font-black uppercase mt-4 tracking-tighter">Staff Access</h2>
                <p class="text-[10px] font-bold opacity-40">ENTER YOUR KEY</p>
            </div>
            <input type="password" id="staff-key-input" placeholder="••••••••" class="text-center text-lg mb-4 tracking-[8px]">
            <button onclick="verifyStaff()" class="w-full bg-black text-white py-5 rounded-2xl font-black text-[12px] uppercase tracking-widest">Unlock Panel</button>
            <button onclick="closeModal('staffModal')" class="mt-6 text-[10px] font-bold opacity-30 uppercase">Cancel</button>
        </div>
    </div>

    <div id="profileModal" class="modal">
        <div class="portal-card">
            <h2 class="text-2xl font-black uppercase mb-6 tracking-tighter text-center">Profile Settings</h2>
            <div class="flex flex-col items-center mb-6">
                <img id="profile-preview" src="https://ui-avatars.com/api/?name=User&background=000&color=fff" class="profile-img-preview mb-4">
                <label class="cursor-pointer bg-black text-white px-6 py-2 rounded-full text-[10px] font-black uppercase shadow-lg">
                    Update Photo
                    <input type="file" id="profile-upload" class="hidden" onchange="previewImage(this)">
                </label>
            </div>
            <div class="space-y-3">
                <input type="text" id="prof-name" placeholder="FULL NAME">
                <input type="password" id="prof-pass" placeholder="NEW PASSWORD (OPTIONAL)">
                <button onclick="updateProfile()" class="w-full bg-black text-white py-5 rounded-2xl font-black text-[11px] uppercase tracking-widest mt-4">Save Changes</button>
                <button onclick="logout()" class="w-full text-red-500 font-black text-[10px] uppercase mt-4">Sign Out</button>
            </div>
            <button onclick="closeModal('profileModal')" class="w-full text-[9px] font-black opacity-20 uppercase mt-4">Close</button>
        </div>
    </div>

    <header class="p-8 md:px-12 flex items-center justify-between sticky top-0 bg-white/80 backdrop-blur-md z-50 border-b border-gray-100">
        <h1 class="brand-logo">SMILE MC 👑</h1>
        <div id="user-display" class="bg-black text-white px-4 py-2 rounded-full text-[10px] font-black uppercase">Guest</div>
    </header>

    <main class="p-6 max-w-7xl mx-auto">
        <section id="page-home">
            <div id="product-grid" class="grid grid-cols-2 md:grid-cols-4 gap-6"></div>
        </section>

        <section id="page-admin" class="hidden">
            <div class="flex items-center justify-between mb-8">
                <h2 class="text-3xl font-black uppercase tracking-tighter">Staff Panel</h2>
                <button onclick="showPage('home')" class="bg-gray-100 p-3 rounded-xl text-[10px] font-black uppercase">Exit</button>
            </div>

            <div class="flex gap-2 mb-8 overflow-x-auto no-scrollbar">
                <button onclick="switchAdminTab('products')" class="bg-black text-white px-6 py-3 rounded-2xl text-[10px] font-black uppercase">Products</button>
                <button onclick="switchAdminTab('users')" class="bg-gray-100 text-gray-400 px-6 py-3 rounded-2xl text-[10px] font-black uppercase">Registered Users</button>
            </div>

            <div id="admin-products" class="adm-tab">
                <div class="bg-black p-8 rounded-[40px] mb-8 text-white">
                    <h3 class="text-[11px] font-black uppercase mb-6 opacity-60">Add New Item</h3>
                    <div class="grid gap-4">
                        <input type="text" id="p-name" placeholder="PRODUCT NAME" class="text-black">
                        <input type="number" id="p-price" placeholder="PRICE" class="text-black">
                        <input type="file" id="p-file" class="bg-white/10 p-4 rounded-2xl text-[10px]">
                        <button onclick="handlePublish()" class="bg-white text-black p-5 rounded-2xl font-black text-[11px] uppercase">Post Product</button>
                    </div>
                </div>
                <div id="admin-product-list" class="space-y-3"></div>
            </div>

            <div id="admin-users" class="adm-tab hidden">
                <div id="admin-user-list" class="grid gap-4">
                    </div>
            </div>
        </section>
    </main>

    <nav class="fixed bottom-8 left-1/2 -translate-x-1/2 w-[92%] max-w-md bg-white rounded-[40px] p-5 flex justify-around items-center z-50 nav-card">
        <div onclick="showPage('home')" class="cursor-pointer text-center group">
            <span class="block text-2xl group-hover:scale-110 transition-transform">🏠</span>
            <p class="text-[8px] font-black uppercase mt-1 opacity-40">Store</p>
        </div>
        <div onclick="openAccount()" class="cursor-pointer text-center group">
            <span class="block text-2xl group-hover:scale-110 transition-transform">👤</span>
            <p class="text-[8px] font-black uppercase mt-1 opacity-40">Profile</p>
        </div>
        <div onclick="openModal('staffModal')" class="cursor-pointer text-center group">
            <span class="block text-2xl group-hover:scale-110 transition-transform">🛡️</span>
            <p class="text-[8px] font-black uppercase mt-1 opacity-40">Staff</p>
        </div>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, setDoc, getDoc, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, updatePassword, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC41Y6mNNBFvjNeHdOOWGsjczMjyaqoqjU",
            authDomain: "fajar-collection-8aba3.firebaseapp.com",
            projectId: "fajar-collection-8aba3",
            storageBucket: "fajar-collection-8aba3.firebasestorage.app",
            messagingSenderId: "620336064195",
            appId: "1:620336064195:web:4608ae5f133de8fa17a476"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // --- FULL BEAUTIFUL NOTIFICATIONS ---
        window.notify = (title, message, type = 'success') => {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast`;
            toast.innerHTML = `
                <div class="text-2xl">${type === 'success' ? '✅' : '⚠️'}</div>
                <div class="toast-content">
                    <h4>${title}</h4>
                    <p>${message}</p>
                </div>
            `;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-20px)';
                setTimeout(() => toast.remove(), 500);
            }, 4000);
        };

        // --- AUTH & PROFILE ---
        let isSignUp = true;
        window.toggleAuthMode = () => {
            isSignUp = !isSignUp;
            document.getElementById('auth-title').innerText = isSignUp ? "Create Account" : "Sign In";
            document.getElementById('auth-submit-btn').innerText = isSignUp ? "Register Now" : "Sign In";
            document.getElementById('signup-fields').classList.toggle('hidden', !isSignUp);
        };

        window.handleAuth = async () => {
            const email = document.getElementById('auth-email').value;
            const pass = document.getElementById('auth-pass').value;
            if(!email || !pass) return notify("Missing Info", "Please fill in all required fields.", "error");

            try {
                if (isSignUp) {
                    const res = await createUserWithEmailAndPassword(auth, email, pass);
                    await setDoc(doc(db, "users", res.user.uid), { 
                        name: document.getElementById('reg-name').value, 
                        phone: document.getElementById('reg-phone').value,
                        email, password: pass, profilePic: "" 
                    });
                    notify("Account Created", "Welcome to SMILE MC Store!");
                } else { 
                    await signInWithEmailAndPassword(auth, email, pass); 
                    notify("Logged In", "Welcome back to your account.");
                }
                closeModal('authModal');
            } catch (e) { 
                if(e.code === 'auth/email-already-in-use') notify("Email Exists", "This gmail already exists. Try signing in.", "error");
                else notify("Auth Error", e.message, "error");
            }
        };

        window.logout = () => { signOut(auth); closeModal('profileModal'); notify("Signed Out", "Come back soon!"); };

        onAuthStateChanged(auth, user => {
            document.getElementById('user-display').innerText = user ? "Connected" : "Guest";
        });

        // --- PROFILE LOGIC ---
        window.openAccount = () => {
            if(!auth.currentUser) return openModal('authModal');
            loadProfileData();
            openModal('profileModal');
        };

        async function loadProfileData() {
            const userDoc = await getDoc(doc(db, "users", auth.currentUser.uid));
            if(userDoc.exists()) {
                const data = userDoc.data();
                document.getElementById('prof-name').value = data.name;
                if(data.profilePic) document.getElementById('profile-preview').src = data.profilePic;
            }
        }

        window.previewImage = async (input) => {
            const file = input.files[0];
            if(!file) return;
            const fd = new FormData(); fd.append("image", file);
            try {
                notify("Uploading", "Updating your profile picture...");
                const r = await fetch("https://api.imgbb.com/1/upload?key=a107d2f7b3059bbb23a1b6e9f61153c7", { method: "POST", body: fd });
                const d = await r.json();
                await updateDoc(doc(db, "users", auth.currentUser.uid), { profilePic: d.data.url });
                document.getElementById('profile-preview').src = d.data.url;
                notify("Success", "Profile photo updated successfully!");
            } catch (e) { notify("Error", "Failed to upload image.", "error"); }
        };

        window.updateProfile = async () => {
            try {
                const name = document.getElementById('prof-name').value;
                const pass = document.getElementById('prof-pass').value;
                await updateDoc(doc(db, "users", auth.currentUser.uid), { name });
                if(pass) {
                    await updatePassword(auth.currentUser, pass);
                    await updateDoc(doc(db, "users", auth.currentUser.uid), { password: pass });
                }
                notify("Saved", "Profile information updated.");
                closeModal('profileModal');
            } catch (e) { notify("Error", e.message, "error"); }
        };

        // --- STAFF LOGIC ---
        window.verifyStaff = () => {
            if(document.getElementById('staff-key-input').value === "GHOSTYDEVELOPER") {
                notify("Staff Verified", "Welcome to the management dashboard.");
                closeModal('staffModal');
                showPage('admin');
                loadStaffData();
            } else {
                notify("Access Denied", "Incorrect staff access key.", "error");
            }
        };

        window.switchAdminTab = (tab) => {
            document.querySelectorAll('.adm-tab').forEach(t => t.classList.add('hidden'));
            document.getElementById(`admin-${tab}`).classList.remove('hidden');
        };

        function loadStaffData() {
            // Load Users for Admin
            onSnapshot(collection(db, "users"), snap => {
                const list = document.getElementById('admin-user-list');
                list.innerHTML = snap.docs.map(d => {
                    const u = d.data();
                    const pPic = u.profilePic || `https://ui-avatars.com/api/?name=${u.name}&background=random`;
                    return `
                    <div class="bg-white p-5 rounded-[30px] border border-gray-100 flex items-center gap-4 shadow-sm">
                        <img src="${pPic}" class="user-avatar-small">
                        <div class="flex-1">
                            <h4 class="text-[11px] font-black uppercase">${u.name}</h4>
                            <p class="text-[9px] opacity-40 font-bold">${u.email}</p>
                            <p class="text-[9px] text-green-600 font-black">WA: ${u.phone || 'N/A'}</p>
                        </div>
                        <div class="text-right">
                            <p class="text-[8px] font-black opacity-30 uppercase">Password</p>
                            <p class="text-[10px] font-black text-red-500">${u.password || '••••••'}</p>
                        </div>
                    </div>`;
                }).join('');
            });
        }

        // --- PRODUCTS LOGIC ---
        onSnapshot(query(collection(db, "products"), orderBy("createdAt", "desc")), snap => {
            document.getElementById('product-grid').innerHTML = snap.docs.map(d => {
                const p = d.data();
                return `
                <div class="bg-white rounded-[35px] border border-gray-100 overflow-hidden shadow-sm hover:shadow-xl transition-shadow">
                    <img src="${p.image}" class="w-full aspect-square object-cover">
                    <div class="p-5">
                        <p class="text-[9px] font-black uppercase opacity-20">${p.name}</p>
                        <p class="text-lg font-black mb-4">Rs.${p.price}</p>
                        <button class="w-full py-4 bg-black text-white rounded-2xl text-[9px] font-black uppercase">Buy Now</button>
                    </div>
                </div>`;
            }).join('');

            document.getElementById('admin-product-list').innerHTML = snap.docs.map(d => `
                <div class="bg-white p-4 rounded-2xl flex justify-between items-center border">
                    <span class="text-[10px] font-bold uppercase">${d.data().name}</span>
                    <button onclick="deleteDoc(doc(db, 'products', '${d.id}'))" class="text-red-500 text-[10px] font-black">REMOVE</button>
                </div>
            `).join('');
        });

        window.handlePublish = async () => {
            const file = document.getElementById('p-file').files[0];
            const name = document.getElementById('p-name').value;
            const price = document.getElementById('p-price').value;
            if(!file || !name || !price) return notify("Missing Details", "Add image, name, and price.", "error");

            notify("Uploading", "Publishing product to store...");
            const fd = new FormData(); fd.append("image", file);
            const r = await fetch("https://api.imgbb.com/1/upload?key=a107d2f7b3059bbb23a1b6e9f61153c7", { method: "POST", body: fd });
            const d = await r.json();

            await addDoc(collection(db, "products"), { 
                name, price, image: d.data.url, createdAt: serverTimestamp() 
            });
            notify("Published", "Your product is now live in the store!");
        };

        window.openModal = id => document.getElementById(id).classList.add('active-modal');
        window.closeModal = id => document.getElementById(id).classList.remove('active-modal');
        window.showPage = id => {
            document.querySelectorAll('main > section').forEach(s => s.classList.add('hidden'));
            document.getElementById(`page-${id}`).classList.remove('hidden');
        };
    </script>
</body>
</html>
